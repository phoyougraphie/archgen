<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>ARCHGEN : bâtiment de la rue</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="bar">
  <h1 id="title">Personnaliser ce bâtiment</h1>
  <p id="status" class="status" role="status" aria-live="polite">Lecture…</p>
</header>

<main class="form street">
  <p class="hint">Un champ vide prend la valeur de la rue, affichée en grisé. « Rue » efface le réglage propre de ce champ.</p>
  <fieldset>
    <legend id="parcel-name">Bâtiment</legend>
    <div class="field"><label for="p-levels">Niveaux, RDC inclus</label><input id="p-levels" data-field="levels" data-kind="int" inputmode="numeric"></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-levels-reset" data-reset="levels" aria-label="Niveaux : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-roof">Toit</label><select id="p-roof" data-field="roof" data-kind="select"><option value="">Celui de la rue</option><option value="flat">Plat</option><option value="gable">Deux pans</option><option value="mansard">Mansarde</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-roof-reset" data-reset="roof" aria-label="Toit : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-ground">Rez-de-chaussée</label><select id="p-ground" data-field="ground_floor" data-kind="select"><option value="">Celui de la rue</option><option value="dwelling">Logement</option><option value="shop">Commerce</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-ground-reset" data-reset="ground_floor" aria-label="Rez-de-chaussée : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-shop">Hauteur du commerce (m)</label><input id="p-shop" data-field="shop_height_m" data-kind="number" inputmode="decimal"></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-shop-reset" data-reset="shop_height_m" aria-label="Hauteur du commerce : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-chimneys">Cheminées</label><select id="p-chimneys" data-field="chimneys" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-chimneys-reset" data-reset="chimneys" aria-label="Cheminées : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-glazing">Vitrage</label><select id="p-glazing" data-field="glazing" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-glazing-reset" data-reset="glazing" aria-label="Vitrage : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-muntins">Petits bois</label><select id="p-muntins" data-field="muntins" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-muntins-reset" data-reset="muntins" aria-label="Petits bois : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-shutters">Volets</label><select id="p-shutters" data-field="shutters" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-shutters-reset" data-reset="shutters" aria-label="Volets : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-dormers">Lucarnes</label><select id="p-dormers" data-field="dormers" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-dormers-reset" data-reset="dormers" aria-label="Lucarnes : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-genoise">Génoise</label><select id="p-genoise" data-field="genoise" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-genoise-reset" data-reset="genoise" aria-label="Génoise : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-stepped_gable">Pignon à redents</label><select id="p-stepped_gable" data-field="stepped_gable" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-stepped_gable-reset" data-reset="stepped_gable" aria-label="Pignon à redents : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-cladding">Bardage bois</label><select id="p-cladding" data-field="cladding" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-cladding-reset" data-reset="cladding" aria-label="Bardage bois : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-timber_frame">Pan de bois</label><select id="p-timber_frame" data-field="timber_frame" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-timber_frame-reset" data-reset="timber_frame" aria-label="Pan de bois : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-classical">Ornements classiques</label><select id="p-classical" data-field="classical" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-classical-reset" data-reset="classical" aria-label="Ornements classiques : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-pilotis">Pilotis</label><select id="p-pilotis" data-field="pilotis" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-pilotis-reset" data-reset="pilotis" aria-label="Pilotis : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-structural_grid">Trame structurelle</label><select id="p-structural_grid" data-field="structural_grid" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-structural_grid-reset" data-reset="structural_grid" aria-label="Trame structurelle : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-sun_shades">Brise-soleil</label><select id="p-sun_shades" data-field="sun_shades" data-kind="bool"><option value="">Comme la rue</option><option value="true">Oui</option><option value="false">Non</option></select></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-sun_shades-reset" data-reset="sun_shades" aria-label="Brise-soleil : revenir au réglage de la rue">Rue</button></div>
    <div class="field"><label for="p-width">Largeur de façade (m)</label><input id="p-width" data-field="width_m" data-kind="number" inputmode="decimal"></div>
    <div class="field"><span class="hint">&nbsp;</span><button type="button" id="p-width-reset" data-reset="width_m" aria-label="Largeur : revenir au réglage de la rue">Rue</button></div>
    <p id="p-width-hint" class="hint wide">La voisine du même côté de rue prend ou cède la différence.</p>
  </fieldset>
  <p id="result" class="hint" role="status"></p>
  <ul id="problems" class="error"></ul>
  <div class="actions">
    <button type="button" id="p-all-reset">Tout revenir au réglage de la rue</button>
    <button type="button" id="p-apply" disabled>Appliquer</button>
  </div>
</main>
<script src="parcel_panel.js"></script>
</body>
</html>
