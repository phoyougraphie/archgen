<style>
/* Plan : un tirage de calque d'architecte. Le bâtiment-racine au centre, les
   branches partent des deux côtés comme des lignes de cote. */
:root {
  --paper: #e9eef0; --sheet: #f6f8f9; --ink: #16242c; --muted: #566a75; --line: #a9bac3;
  --accent: #1d4fc4; --accent-soft: #d6e1f8;
  --done: #15803d; --code: #b45309; --doing: #1d4fc4; --todo: #7c8d97; --block: #be123c;
  --mono: "Sometype Mono", ui-monospace, Menlo, Consolas, monospace;
  --body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1820; --sheet: #14222b; --ink: #e3ecf1; --muted: #93a7b3; --line: #35495a;
  --accent: #7ea6ff; --accent-soft: #1e3259;
  --done: #4ade80; --code: #fbbf24; --doing: #7ea6ff; --todo: #8195a1; --block: #fb7185; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0d1820; --sheet: #14222b; --ink: #e3ecf1; --muted: #93a7b3; --line: #35495a;
  --accent: #7ea6ff; --accent-soft: #1e3259;
  --done: #4ade80; --code: #fbbf24; --doing: #7ea6ff; --todo: #8195a1; --block: #fb7185; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.45 var(--body); display: flex; flex-direction: column; overflow: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--sheet); }
h1 { font: 600 15px var(--mono); letter-spacing: .04em; margin: 0; }
.progress { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { width: 140px; height: 7px; border: 1px solid var(--line); display: flex; }
.bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font: 12px var(--mono); color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; background: var(--c); }
.tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
input, button { font: 13px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); padding: 4px 9px; border-radius: 2px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input { width: 160px; max-width: 100%; }
main { flex: 1; min-height: 0; display: flex; }
#stage { flex: 1; min-width: 0; position: relative; cursor: grab; touch-action: none; overflow: hidden;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 48px 48px; background-position: -1px -1px; }
#stage::after { content: ""; position: absolute; inset: 0; background: var(--paper); opacity: .78; pointer-events: none; }
#stage.drag { cursor: grabbing; }
svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
.link { fill: none; stroke: var(--line); stroke-width: 1.4; }
.node { cursor: pointer; }
.node rect { fill: var(--sheet); stroke: var(--line); }
.node text { fill: var(--ink); font: 13px var(--body); dominant-baseline: central; }
.node.branch rect { stroke: var(--accent); stroke-width: 1.4; }
.node.branch text { font-weight: 700; }
.node.root rect { fill: var(--accent); stroke: var(--accent); }
.node.root text { fill: var(--sheet); font: 600 15px var(--mono); }
.node.sel rect { stroke: var(--accent); stroke-width: 2.4; }
.node.hit rect { fill: var(--accent-soft); }
.node .tick { stroke: none; }
.node .more { fill: var(--muted); font: 11px var(--mono); }
aside { width: 340px; flex: none; overflow: auto; border-left: 1px solid var(--line); background: var(--sheet); padding-block: 16px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
aside h2 { font: 700 17px/1.25 var(--body); margin: 0 0 4px; text-wrap: balance; }
aside .crumbs { font: 11px var(--mono); color: var(--muted); margin-bottom: 10px; letter-spacing: .02em; }
aside p { margin: 0 0 10px; max-width: 65ch; }
aside .status { display: inline-block; font: 11px var(--mono); padding: 1px 7px; border: 1px solid var(--c); color: var(--c); margin-bottom: 10px; }
aside .ref { font: 12px var(--mono); color: var(--accent); overflow-wrap: anywhere; }
aside ul { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
aside li button { width: 100%; text-align: left; background: none; border-color: transparent; padding: 3px 6px; }
aside li button:hover { border-color: var(--line); }
@media (max-width: 760px) {
  main { flex-direction: column; }
  aside { width: auto; height: 38%; border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .tools { margin-left: 0; }
}
</style>

<script id="data" type="application/json">{"label":"ARCHGEN","note":"Extension SketchUp de bâtiments paramétriques, V0.1.","children":[{"label":"État courant","note":"Où en est le développement, à lire en premier","children":[{"ref":"docs/DECISIONS.md","label":"Prochaine action","note":"0.32.0 : balcons d'angle, bow-windows, bâtiments en L, T, U, import des contours en L, T, U (ADR-65, ADR-66). Vu dans SketchUp (H43). Suite possible : étagement des bâtiments isolés, jonction des toits des ailes ; EXT-08, J21 (reporté). Recettes H26 à H36, H38 à H40 à la main. Commits non poussés depuis 34f74cf.","children":[]},{"ref":"docs/DECISIONS.md","label":"Décisions tranchées D-07 à D-12","note":"D-10 : clous de passage piéton et plots de chaussée (ADR-42). D-12 : pont né au croisement (ADR-40). D-11 : un cours d'eau ou une côte est une voie (ADR-39). D-08 : copie entaillée (ADR-38). D-07 : carrefour automatique (ADR-36). D-09 : 3D simple (ADR-35).","children":[]},{"ref":"docs/DECISIONS.md","label":"D-17 à D-22 tranchées","note":"Détails : vitre et porte pleine, vitrine par travée, commerces sur toute la rue puis au clic droit, souches contre les murs latéraux, largeur par la limite mitoyenne, clic droit dans la rue ouverte (ADR-45). Aucune décision ouverte.","children":[]},{"ref":"docs/DECISIONS.md","label":"Consigne de vérification","note":"Ne pas piloter SketchUp systématiquement : tests Ruby et sondes scriptées d'abord (test/host/v01.rb enchaîne tout, rapport dans tmp/), écran seulement pour la recherche de bug, la console ou une étape importante. Aucun contrôle hôte réussi sans preuve.","children":[]},{"ref":"docs/DECISIONS.md","label":"D-01 tranchée","note":"Variation des baies arrondie à 5 mm (ADR-43) : 100 % des graines acceptées de 1 à 30 cm, contre 1 % à 2 cm avant.","children":[]},{"ref":"docs/DECISIONS.md","label":"D-13 à D-16 tranchées","note":"Rues variées : niveaux tirés dans une fourchette avec écart borné, toits tirés dans une liste, un seul style par rue, murs mitoyens découverts aveugles (ADR-44). Aucune décision ouverte.","children":[]},{"ref":"docs/DECISIONS.md","label":"D-03 et D-04 tranchées","note":"Onglet, tous angles permis (ADR-30) ; forme de l'accès selon le style (ADR-31). D-05 et D-06 : terrain intact, terrain avant rue (ADR-27).","children":[]},{"ref":"docs/recette/H11.md","label":"Mesures H11","note":"SketchUp 26.2.243, Ryzen 7 5800H, p95 : plan Haussmann 12×9 13 à 71 ms (cible 150 ms) ; écriture LOD 1 52 à 161 ms (cible 2 s) ; 24×18 Structural 454 ms en générique, 921 ms en Toulousain (cible 5 s) ; 20 régénérations +0,89 Mo (plafond 10 Mo), cadres stables. Plus grand plan accepté : environ 5,5 s, hors contrat.","children":[]},{"ref":"docs/MATRICE_POSTE.md","label":"Environnement","note":"Windows 11, Ruby 3.2.11, Bundler 2.4.19, Minitest 5.25, Rake 13.0. SketchUp 2026 (26.2.243, Ruby 3.2.2) installé ; macOS et SketchUp 2024/2025 hors cible V0.1.","children":[]},{"label":"Git","note":"Remote github.com/phoyougraphie/archgen. main = spec de base ; dev/v0.1 = développement. Auteur local phoyougraphie, adresse noreply. Pas de `gh` sur le poste.","children":[]},{"label":"Commande de test","note":"bundle exec rake test (Ruby pur, sans SketchUp). Le script hôte test/host/run.rb se charge à la main dans la console SketchUp.","children":[]},{"label":"Journal","note":"Écarts et décisions rencontrés en développement","children":[{"label":"2026-11-05 Spec","note":"Relue ; chiffres U05 à U10 recalculés à la main et cohérents (259 cellules, 218/709 faces, 119,00 m², 27,82272 m³).","children":[]},{"label":"2026-11-05 Écart jitter","note":"Mesuré à l'implémentation d'AG-010 ; contrat conservé, voir D-01.","children":[]},{"label":"2026-11-05 Ajouts","note":"E_PLAN (ADR-11), refus de LOD 1 avant AG-015 (ADR-12), données embarquées (ADR-13).","children":[]},{"label":"2026-11-05 H01","note":"Réussi sur SketchUp 26.2.243. Le noyau dans le Ruby embarqué 3.2.2 redonne les empreintes de plan exactes. L'ordre du menu Extensions varie d'un démarrage à l'autre : ne pas viser une position fixe en recette.","children":[]},{"label":"2026-11-05 H02","note":"Réussi. Rapport de sonde écrit dans tmp/h02-\u003clabel>.txt (ignoré par Git) : plus fiable qu'une capture. Installer le RBZ puis redémarrer SketchUp pour charger un nouveau fichier du manifeste.","children":[]},{"label":"2026-11-05 D-02 tranchée","note":"Arêtes de grille masquées (ADR-15), H02 rejoué et réussi.","children":[]},{"label":"2026-11-05 H03 et H04","note":"Réussis. Un Annuler ramène matériaux, tags et définitions à l'identique. Menus SketchUp : cliquer d'abord dans la vue, sinon le premier clic sur Édition après la console ne l'ouvre pas.","children":[]},{"label":"2026-11-05 H05","note":"Réussi. Le copier-coller réel reproduit bien l'UUID et partage la définition. Cliquer dans la vue vide déselectionne : ne pas le faire avant un Copier au menu.","children":[]},{"label":"2026-11-05 H06 et H07","note":"10 pannes natives, aucun résidu ni ligne d'historique. H07 a trouvé un vrai défaut : jeton lié à l'objet Model, sans valeur sous Windows ; corrigé par le guid (ADR-18). H03 à H07 rejoués sur le code final. À faire en AG-017 : recharger la sélection après un enregistrement.","children":[]},{"label":"2026-11-05 H08","note":"Réussi : 12 variantes, 248 cadres pour 4 définitions. Le recouvrement balcon/baie est inatteignable d'après les dégagements du contrat ; garde conservée et testée sur le solveur. À rejouer en AG-018 : Annuler, Rétablir et pannes en LOD 1.","children":[]},{"label":"2026-11-05 H09","note":"Réussi après trois défauts corrigés (cote avec débord, message répété par baie, champs de toit visibles). Node absent du poste : JS testé dans le moteur du panneau via ArchgenPanelProbe.run_js_tests. Panneau et menu Édition se recouvrent en recette.","children":[]},{"label":"2026-11-05 H10","note":"Réussi après six défauts corrigés, dont deux vus seulement par la recette scriptée (champ à 12 pour un brouillon à 13 après enregistrement, notices jamais retirées). dialog.close est asynchrone sous Windows : rouvrir à l'étape suivante. Après un démarrage, attendre avant de coller dans la console : le presse-papiers peut être repris par SketchUp.","children":[]},{"ref":"docs/RUE_ILOT_TERRAIN.md","label":"2026-11-05 Besoin ajouté","note":"Générateur de rue et d'îlots au tracé (geste du Mur connecté YSKE, 1 à 3 accès de cour sur forme fermée) et terrassement sur terrain accidenté. Hors V0.1.","children":[]},{"label":"2026-11-05 Push bloqué","note":"Aucun identifiant GitHub sur le poste à ce stade ; commits locaux en attente si la branche n'apparaît pas sur le remote.","children":[]},{"label":"2026-11-06 H11","note":"Réussi, aucun code livré modifié. Trois écarts de la sonde corrigés : brouillon qui n'était pas la fixture, model.definitions compte aussi les groupes, l'objet Ruby d'une définition change après un Rétablir (comparer le contenu ou le persistent_id). H06 et H07 rejoués en LOD 1, 12 pannes sans résidu. Avec type via presse-papiers, valider la console par une touche Entrée séparée.","children":[]},{"ref":"docs/recette/H12.md","label":"2026-11-06 H12","note":"Réussi vers Blender 5.2 sans interface : écart nul sur W, D, H-toit, 148 baies traversantes. L'OBJ n'a pas d'unité : units 'model' donne un facteur 1 000 dans le gabarit Architecture en millimètres, exporter en 'm'. Accents remplacés par _ dans les noms de matériaux.","children":[]},{"ref":"docs/DECISIONS.md","label":"2026-11-06 Cible réduite","note":"Choix du propriétaire : Windows et SketchUp 2026 seulement, AG-019 débloqué.","children":[]},{"ref":"docs/recette/V0.1.md","label":"2026-11-06 AG-020","note":"RBZ 0.1.0 installé, H01 à H12 rejoués sans échec. Bascule du Gestionnaire non conservée au redémarrage sur ce poste, alors que check/uncheck en Ruby l'est ; fermer SketchUp normalement, une fermeture forcée perd l'état. Sketchup.quit peut ramener à l'accueil sans quitter. Ne pas cliquer le gabarit d'accueil avant 28 s. Viser les boutons du panneau d'après une capture : ils bougent avec l'aperçu.","children":[]},{"ref":"docs/TERRAIN_CONTRACT.md","label":"2026-11-06 EXT-10 préparé","note":"D-05 et D-06 tranchées. Sonde raytest : altitude exacte, relance sous obstacle sans blocage, trou et masqué = nil, 0,84 ms par rayon, d'où un relevé sur demande au pas de 2 m. Terrain intact : plateforme au point haut par défaut, déblai annoncé mais non montré. Assise appliquée à une racine déjà placée.","children":[]},{"ref":"docs/recette/H13.md","label":"2026-11-06 H13 relevé","note":"26 contrôles, écart 0,0005 mm. open_application lance une seconde instance si SketchUp tourne déjà : vérifier les processus d'abord, et regarder l'écran avant de cliquer. La session Windows se verrouille après inactivité : LogonUI actif = écran inaccessible, demander au propriétaire.","children":[]},{"label":"2026-11-06 H13 écriture","note":"Vrai défaut trouvé : un rayon le long d'une arête verticale du soubassement ne renvoie rien ; rayons décalés de 0,2 mm. Les scripts patch en heredoc cassent les accents sous Git Bash (CP850) : les écrire dans un fichier. Le second clic sur Édition n'ouvre le menu qu'après un survol et 3 s.","children":[]},{"ref":"docs/recette/H14.md","label":"2026-11-06 AG-026","note":"Vrai défaut présent depuis la 0.1.0 : set_on_closed est perdu à la fermeture, la page rouverte recevait une ancienne réponse et annonçait une création non écrite. Rattaché à chaque affichage, init vide la mémoire. Rejeu : dernier cas de charge figé, fenêtre fermée à la main par le propriétaire, pas de plantage ; prévenir avant une charge, run_h14 rejoue H14 seule. Le relevé coûte 30 à 50 ms par point sur 100 000 faces. Une réponse témoin posée juste après show est effacée par init : attendre la page.","children":[]},{"ref":"docs/ENSEMBLE_CONTRACT.md","label":"2026-11-06 EXT-07 préparé","note":"D-03 onglet, D-04 selon le style. Parcelle en trapèze à façade et arrière parallèles, donc convexe et toit en section ; murs mitoyens gardés ; même gabarit par ensemble. Report : carrefours, trottoirs, modification d'une seule parcelle. Annoncer la durée avant une écriture longue : une fenêtre figée se fait fermer.","children":[]},{"ref":"docs/ENSEMBLE_CONTRACT.md","label":"2026-11-06 AG-028","note":"Contrat corrigé à l'implémentation : l'écart de 3 m entre parcelles contredisait l'arrière minimal de 2 m autour d'un angle, il ne vaut donc plus entre segments contigus. Les numéros de segment restent ceux du tracé saisi, même parcouru à l'envers. Dans une classe de test, une méthode placée après private n'est pas lancée.","children":[]},{"ref":"docs/ENSEMBLE_CONTRACT.md","label":"2026-11-06 AG-030","note":"Trame des baies resserrée entre les joints : sinon un angle rentrant très fermé refusait toute la parcelle. À angle droit, le calcul V1 reste séparé pour ne pas bouger les empreintes. Reculs et travées arrière ne sont pas dans la configuration : AG-031 doit les inclure pour partager une définition entre parcelles.","children":[]},{"ref":"docs/ENSEMBLE_CONTRACT.md","label":"2026-11-06 AG-031","note":"Calcul pur sous Ruby 3.2.11, hors écriture : 10 à 69 ms pour 12 à 50 parcelles, au plus 231 ms pour 200 ; 1 à 3 définitions grâce au partage, sans jitter. Le plafond de 400 000 faces étendues refuse déjà 200 parcelles Brutaliste Structural LOD 1 (401 723) : à revoir avec la mesure d'écriture d'AG-032. Les profils livrés n'ont aucun tirage de style. D-01 pèse davantage ici : un jitter refuse presque toujours au moins une parcelle, donc tout l'ensemble.","children":[]},{"ref":"docs/recette/H15.md","label":"2026-11-06 AG-032","note":"Le coût d'écriture suit les faces uniques : 200 parcelles droites 2,4 s, 76 parcelles sans partage 14 à 17 s. Plafond étendu porté à 600 000. view.write_image évite de piloter l'écran pour regarder un rendu. Copie de développement dans Plugins, l'ancienne dans tmp/plugins-avant-ag032/.","children":[]},{"ref":"docs/recette/H16.md","label":"2026-11-06 AG-033","note":"Une page se charge après l'activation de l'outil : init lui redonne l'état, sinon le statut reste faux. Un Result en erreur perd sa valeur : le tracé refusé transporte ses refus dans le résultat. Le panneau ouvert au coin cachait le menu Édition. En sonde, viser un point visible : une vue de dessus évite un clic hors de l'écran.","children":[]},{"ref":"docs/ENSEMBLE_CONTRACT.md","label":"2026-11-06 AG-034","note":"Premier îlot fermé, Brutaliste, tracé à la vraie souris : carré de 52 m, 13 bâtiments, 3 accès, fermeture au premier point à quelques pixels, Annuler et Rétablir au vrai clavier et au vrai menu, vues de la rue et de la cour regardées. Preuve à l'écran seulement, la sonde scriptée de l'îlot viendra en H17. Une candidate doit avoir ses deux voisines sur son segment : sinon un sommet plat ouvrirait un vide contre un autre segment.","children":[]},{"ref":"docs/ENSEMBLE_CONTRACT.md","label":"2026-11-06 AG-035","note":"La hauteur de porche prévue, 3,5 m, ne tient sous aucun style livré : leur RDC ne laisse que 2,8 et 2,9 m. Départ ramené à 2,7 m, réglable ; un premier niveau plus haut le permet. Porche regardé à hauteur d'œil, écrit par le service dans deux styles ; le geste souris et la vraie copie restent pour H17. En sonde, la première instance du gabarit est le personnage : chercher la racine par son attribut.","children":[]},{"ref":"docs/recette/H17.md","label":"2026-11-06 AG-036","note":"La recette complète passait alors que le vrai clic sur Remplacer ne faisait rien : le change d'un champ à la perte de focus désactivait le bouton sous la souris. Un clic DOM ne perd pas le focus : toujours faire le vrai geste sur une étape importante. Trois RBZ successifs, recette complète rejouée sur le dernier.","children":[]},{"ref":"docs/recette/H18.md","label":"2026-11-07 AG-027","note":"Une dalle pile à l'altitude du terrain arrête le rayon, qui repart dessous et ne voit plus le terrain : relance à 1 mm puis 5 mm après un obstacle. Le vrai geste a encore montré quatre défauts d'interface invisibles au DOM. Faire le geste avant la recette complète évite de la rejouer. Une sonde qui ne lit que les sommets donne de fausses alertes : lire le bord réel.","children":[]},{"ref":"docs/VOIRIE_CONTRACT.md","label":"2026-11-07 EXT-11 cadré","note":"Demande du propriétaire : coupe d'abord, à l'échelle humaine, puis carrefours, rails, routes variées ; mobilier urbain renvoyé à EXT-12. Une maquette a suffi à montrer deux écueils : le terrain intact enterrerait les fossés (D-08), et une autoroute n'a pas de carrefour à niveau. Le tracé devra gagner des rayons. Dans une sonde de page, rechercher les boutons à chaque clic : un rendu les remplace.","children":[]},{"ref":"docs/VOIRIE_CONTRACT.md","label":"2026-11-07 AG-037","note":"Le contrôle de couronne a trouvé un défaut dans un préréglage de la maquette : arbre colonnaire du boulevard au-dessus d'une voie à 2,24 m ; terre-plein porté à 6 m. Une raison de refus passée par une variable échappe au relevé des messages du panneau : la tester à part. Le message de version d'une coupe parle encore d'un bâtiment, à reprendre en AG-038.","children":[]},{"ref":"docs/recette/H19.md","label":"2026-11-07 AG-038","note":"Le panneau reçoit une chaîne JSON, pas un objet : un banc de navigateur qui passait un objet a caché le défaut, seul SketchUp l'a montré. SketchUp n'expose à la page que les rappels connus à son chargement : une sonde se rattache juste après show. Un script de page modifié n'est pas toujours relu dans la même session : redémarrer SketchUp avant une recette. La sonde à l'écran a trouvé un personnage de 1,49 m, pieds en l'air : mesurer le repère d'échelle lui-même.","children":[]},{"ref":"docs/recette/H19.md","label":"2026-11-07 Échelles","note":"À la demande du propriétaire, chaque objet de la coupe est mesuré dans la géométrie rendue : 18 écarts sur 82 avant correction (rails 12 cm trop haut, train flottant de 13 cm, crosses et globe au-dessus de la hauteur annoncée). Après : 102 objets, 0 écart dans SketchUp. Un dessin « à l'œil » ne suffit pas : mesurer chaque objet contre le sol réel.","children":[]},{"ref":"docs/VOIRIE_CONTRACT.md","label":"2026-11-07 AG-039","note":"Sur un arc comme à l'onglet, un quadrilatère de ruban en pente reste plan : les deux arêtes de coupe sont coplanaires. Une marche de ballast n'est pas une bordure : la bordure est réservée aux trottoirs, terre-pleins, bandes plantées et pistes. Une raison émise par une méthode error échappe au relevé des messages : la tester à part.","children":[]},{"ref":"docs/VOIRIE_CONTRACT.md","label":"2026-11-07 AG-040","note":"D-09 tranchée : 3D simple (ADR-35). La coupe ne transmettait pas la variation de hauteur à la pose : une seule hauteur d'arbre sur la route de campagne, vu en comptant les définitions. Une assertion « moins d'objets sur la ligne intérieure » était trop faible : mesurer la longueur de la ligne.","children":[]},{"ref":"docs/VOIRIE_CONTRACT.md","label":"2026-11-07 AG-041","note":"Un rail au ras de la chaussée, posé comme une face à part, scintillerait dans SketchUp : il est taillé dans la surface. La matière des rails portait la clé de la bande de ballast (road/rail) : le ballast aurait pris leur couleur, vu en comptant les matières ; clé distincte road/rail_steel.","children":[]},{"ref":"docs/recette/V0.5.md","label":"2026-11-07 AG-042","note":"Le writer existant a suffi : la voie est un plan comme un autre, avec ses balises par famille et des définitions préfixées road1/. Le banc de navigateur relié au vrai service sur doubles a trouvé trois défauts d'affichage avant SketchUp. Au vrai geste, un segment tapé en perspective est parti presque à rebours : refus juste, message à mieux dire. Recette complète : deux sondes se partagent un panneau ; une sonde doit cesser d'écouter après sa fin, et ne pas supposer l'état de départ d'une session. Copier-Coller des recettes H05 et H17 : surveiller le journal pour ne pas les manquer.","children":[]},{"label":"2026-11-07 AG-043","note":"D-07 tranchée : carrefour automatique (ADR-36). Un contrôle de couverture vu de dessus (chaque point des emprises couvert une fois) a trouvé quatre défauts que la validation du plan laissait passer : coin aigu dont l'angle extérieur du trottoir tombait côté chaussée (arrondi extérieur ajouté), corde au côté convexe d'une jonction à 150° (onglet), chemin rejoignant une rue (coin vide accepté au niveau du cœur), bords très inégaux (refus junction_shape, un rayon plus grand passe). Le format du plan n'admet que triangles et quadrilatères : les sommets en T entre tronçon et carrefour sont soudés en retriangulant la face touchée. Une passe de retrait a effacé le début d'un fichier non suivi, reconstitué depuis la session ; tests rejoués. Besoin noté : canaux, rivières, fleuves et ponts (EXT-13, D-11, D-12).","children":[]},{"label":"2026-11-07 AG-044","note":"Le marquage est taillé dans la surface comme les rails : la zone du carrefour s'allonge du passage, de la garde et de la ligne d'arrêt, balayée avec une ligne de coupe dont les segments marqués changent de matière ; la soudure d'AG-043 raccorde les bandes sans autre code. Mon attente de test sur la ligne d'arrêt était fausse : la rue de ville a son stationnement au nord de la branche est, la voie qui entre va de -1 à 2 m. La ligne d'arrêt couvrait aussi les bandes dérasées : restreinte aux voies (lane).","children":[]},{"label":"2026-11-07 AG-045","note":"Un anneau est un polygone à trou, que la triangulation par oreilles ne sait pas faire : la chaussée est découpée en secteurs le long de la ligne médiane de chaque branche, l'îlot séparateur s'y loge par un détour de chaque côté. Le contrôle de couverture ne regardait que les emprises : étendu au disque du giratoire et à ce qui en déborde ; marge de 6 cm pour la flèche des arcs. Deux fausses alertes de test (disque mal centré sur un X oblique, arrondis d'entrée pris pour l'anneau), corrigées en lisant le centre du nœud dans le plan (point_m).","children":[]},{"label":"2026-11-07 AG-046","note":"Le contrat prévoyait deux anneaux autour d'un seul nœud : intenable, une branche passe par son nœud et non par le centre d'un anneau décalé. Décidé et consigné (ADR-37) : deux nœuds voisins sur une voie, jumelés ; la liaison est le bout de voie entre eux, sans îlot séparateur. Une commande d'essai attendait une saisie (python3 -) et a bloqué la session deux minutes, arrêtée.","children":[]},{"label":"2026-11-07 AG-047","note":"Le passage à niveau est reporté en AG-050 : le ballast est à 0,35 m et le dessus des rails à 0,52 m, une route ne les franchit qu'en rampe, donc avec le profil en long d'AG-049 ; mieux qu'un muret de 52 cm inventé. Le tram traverse en couloir balayé, ce qui coupe le cœur en deux et l'îlot central en deux morceaux fermés par une corde. Le passage piéton d'un carrefour à feux écrasait les rails : le marquage ne remplace plus un rail.","children":[]},{"label":"2026-11-07 AG-048","note":"Le service de réseau hérite de celui de la voie (libellés, matière, forme d'entrée). Un banc de navigateur nourri par le vrai contrôleur a montré que l'état renvoyé partageait la liste des réglages (copie). Dans SketchUp : soudure en O(arêtes × sommets), 89 s pour 9 giratoires, ramenée à 1,4 s par un index de cases ; voie refusée quand son premier point n'est pas rond (reste de 10⁻⁷) ; rouvrir le même fichier depuis une minuterie a figé SketchUp, réouverture à la main. Vrai geste : « 100 » tapé dans un gabarit en millimètres donne 100 mm, il faut « 100m ».","children":[]},{"label":"2026-11-07 AG-049, étape 1","note":"D-08 tranchée : copie entaillée (ADR-38). Le contrat est écrit avant le code. Profil en long et talus dans le noyau, vérifiés à la main sur un plan incliné. Un nom de refus (toe_not_found) existait déjà pour l'assise : le refus de la voie s'appelle road_toe_not_found. En bout de voie, l'abscisse calculée dépassait de 4·10⁻⁷ la dernière de la grille quantifiée : tolérance de 10⁻⁶.","children":[]},{"label":"2026-11-08 AG-049, étape 2","note":"Entaille par faces verticales temporaires et intersection SketchUp, faces intérieures effacées. En recette, le relevé de l'original masqué perdait des points : la copie le recouvre exactement hors de l'entaille et un rayon qui la touchait repartait sous l'original ; toucher la copie vaut toucher le terrain. Mes scripts d'édition écrivaient en CRLF sous Windows (un test de la page l'a vu) : fichiers ramenés en LF, écriture binaire désormais. Version de développement 0.7.0-dev.","children":[]},{"label":"2026-11-08 AG-049, vrai geste","note":"Créer la voie ne faisait rien sur un terrain : la confirmation recalculait l'aperçu sans le relevé, et le refus était écrasé par l'aperçu suivant. Corrigé, avec un test de contrat du parcours du panneau, qui manquait. Le premier clic sur le panneau après un tracé ne fait que lui donner le focus.","children":[]},{"label":"2026-11-08 AG-050","note":"Pas de cœur de carrefour : les deux voies traversent. La route reçoit un profil en long (stations ajoutées, comme sur un terrain) ; la voie ferrée garde rails et traverses continus, ses autres objets sont calculés par morceaux autour de la route. Platelage 5 mm sous le dessus des rails pour éviter des faces superposées. U28 se servait de level_crossing comme type inconnu : interchange désormais.","children":[]},{"label":"2026-11-08 Recette 0.7.0","note":"TerrainSurveyor ayant changé, H13 et H15 à H18 rejouées avec la voirie (nouvel enchaînement run_terrain) : 0 échec. Vu dans SketchUp au passage à niveau : un lampadaire de la rue entre les rails et une croix en « + » ; corrigés, paquet reconstruit, toutes les recettes rejouées sur le final.","children":[]},{"label":"2026-11-08 EXT-13 cadré","note":"Demande du propriétaire : l'eau et les ponts d'abord ; rivière qui suit le terrain, canal à écluses, fleuve sur terrain plat, et une astuce pour le bord de mer. Retenu : la mer est la dernière bande de la coupe, falaise et plage abaissent les bandes qui suivent (niveaux cumulés) ; écluses placées par une règle fixe, rivière en enveloppe descendante. D-11 tranchée (ADR-39) ; ponts en AG-057, après D-12.","children":[]},{"label":"2026-11-08 AG-051","note":"D-12 tranchée : pont né au croisement (ADR-40). Revanche et profondeur deviennent des réglages de bande, champs facultatifs du format V1 (ADR-41) : les 22 plans des anciens préréglages sont identiques avant et après. Le lit est dans la ligne de coupe, mur de quai compris ; la surface de l'eau est un ruban à part, pour ne pas couper les murs dans SketchUp. Eau sur un terrain et eau dans un réseau refusées en attendant AG-053, AG-055 et AG-057. Le dessin du panneau descend jusqu'au lit ; pas encore vu dans SketchUp.","children":[]},{"label":"2026-11-08 AG-052","note":"Niveaux cumulés de la terre vers la mer, de quelque côté que soit la mer ; une coupe sans mer ne bouge pas (28 plans des préréglages d'avant identiques). La ganivelle est une paroi de bois et ses poteaux, pas des lattes une à une : 770 lattes par 100 m dépasseraient vite le plafond d'objets. Le muret ne se pose pas en tête de falaise, dont le front n'accepte rien : le sentier côtier porte la barrière. Une mer large demande un grand rayon de son côté ; axe côté terre, on vire librement de l'autre. Pas encore vu dans SketchUp.","children":[]},{"label":"2026-11-08 AG-053","note":"Le lit se règle sur le terrain sous l'eau, pas sous toute l'emprise ; enveloppe descendante, borne de pente propre à l'eau. Copie 0.8.0-dev installée dans Plugins ; H23 par le service : 9/9 après deux corrections de la sonde (mon terrain de test dépassait la borne de 3 % : refus juste ; le refus à contre-pente était testé sur un terrain déjà masqué par la rivière, limite d'ADR-38). Premier vrai rendu de l'eau : opacité 0,6, lit creusé dans la copie entaillée.","children":[]},{"label":"2026-11-08 AG-054","note":"Écluses placées par la règle du contrat, la chambre finissant au point de pente précédent. Une seule ligne de coupe ne peut pas avoir le lit bas et les berges en rampe : la chambre est balayée avec une coupe dont seuls les points du lit sont décalés, d'où l'exigence de quais (canal_needs_quays). Portes simplifiées en battants droits, propres à chaque écluse (leur hauteur dépend de la chute), et non en définitions partagées. Ajouts au contrat : lock_outside_trace ; le lit plus bas de la chambre n'entre pas dans le contrôle des terrassements. H23 rejouée avec un canal de quatre écluses : 12/12 au premier passage.","children":[]},{"label":"2026-11-08 AG-055","note":"Demande du propriétaire : fond marin à 3 m, atteint en pente sur 10 m depuis la plage ou le pied de la falaise ; la marche de 1 m disparaît. Un fleuve à quais n'aurait jamais tenu sur un terrain (lit à 8 m sous les quais, au-delà des 6 m) : pour toute voie à eau, les terrassements se mesurent désormais aux bandes de terre ; la rivière de H23 passe de 3,40 à 1,56 m de déblai. Côté mer, ni talus ni toe : le contour suit le bord de la mer. Vu à l'écran : un terrain plat plus haut que la mer au-delà de son bord forme un mur au large (conforme, noté). H23 14/14.","children":[]},{"label":"2026-11-08 AG-056 et recette 0.8.0","note":"Régime de l'eau dans Tracer une voie, réglages sous chaque bande, chute et écluses dans l'aperçu ; en modification, le régime part avec la dernière bande d'eau (une clé à nil est retirée des réglages fusionnés). Vrai geste : canal sur terrain d'essai, 4 écluses annoncées puis écrites. Deux défauts vus : rangée des réglages illisible (au geste), ganivelle dessinée à 10 m dans la coupe (par H19, forme absente du dessin). Corrigés, paquet reconstruit, H13 à H23 rejouées : 0 échec. Saisie « longueur;angle » au clavier non prise pendant le geste : tracé fait à la souris.","children":[]},{"label":"2026-11-08 Contrat des ponts","note":"Écrit avant le code. Un pont est un type de nœud, comme le passage à niveau : pas de cœur, voie portée en rampes, voie franchie inchangée. Sur l'eau il naît d'office (seul type possible) ; entre deux routes, le réglage over choisit la voie portée, sans défaut implicite. AG-057 découpé en trois : poutre (noyau), arc et voûte, panneau et RBZ 0.9.0. Réseau toujours horizontal : pont sur terrain hors lot.","children":[]},{"label":"2026-11-08 AG-057","note":"Le pont réutilise la mécanique du passage à niveau (profil, zones, objets coupés), plus un groupe road/bridges de solides : tablier 2 cm sous la chaussée (aucune face doublée), culées sous le haut des rampes, garde-corps qui servent de rive. Écarts au contrat consignés : tous les objets sous le tablier s'interrompent (pas de tri par hauteur) ; « simple » sur l'eau vaut pont. Six réseaux types identiques avant et après. Copie 0.9.0-dev : premier pont vu dans SketchUp, conforme. Un remplacement de Plugins lancé en même temps que la construction du paquet a vidé Plugins un instant ; refait dans l'ordre.","children":[]},{"label":"2026-11-08 AG-058","note":"Le gabarit du contrat (« hauteur libre » au-dessus de chaque bande) rendait l'arc impossible : à la clé, il touche le tablier ; aux bandes il descend. Corrigé dans le contrat : le gabarit sous un arc ou une voûte est celui de la bande (4,5 m) ou 2,5 m sur l'eau, et le refus donne la hauteur libre qui suffit, trouvée par dichotomie. Le plan n'admet que triangles et quadrilatères : abouts d'arc et de tympan découpés en bandes entre deux chaînes.","children":[]},{"label":"2026-11-08 AG-059 et recette 0.9.0","note":"Type Pont au panneau de réseau, eau dans le réseau à un seul niveau, eau en plan. Un réseau refusé gardait autrefois sa liste de carrefours vide : un pont refusé (voie portée manquante) devenait impossible à corriger ; la liste précédente reste. Vrai geste : rue et rivière à la souris, pont d'office passé en arc, réseau créé ; les longueurs au clavier et les clics d'options de liste n'arrivent pas depuis l'automatisation (choix au clavier). H24 9/9 après deux corrections de la sonde ; H13 à H23 rejouées sur le RBZ final : 0 échec.","children":[]},{"label":"2026-11-08 AG-060","note":"D-10 tranchée par le propriétaire : B et C. Le plot se pose sur la limite gauche de sa bande (pas de réglage de position) ; les clous sont une option du carrefour à feux, désactivée par défaut, pour que les réseaux enregistrés gardent leur empreinte (34 voies et 6 réseaux vérifiés identiques).","children":[]},{"label":"2026-11-08 D-01","note":"Tranchée par le propriétaire, option A (ADR-43). Le décalage, et non le centre, est arrondi : une porte non décalée garde ainsi ses bords sur la même grille que les fenêtres au-dessus d'elle. L'amplitude est bornée au multiple de 5 mm inférieur, pour ne jamais sortir de la grille. Mesure avant/après sur 500 graines : 0–73 % → 100 %.","children":[]},{"label":"2026-11-08 Rues variées cadrées","note":"Demande du propriétaire : hauteurs et toits variés à la génération d'une rue. La géométrie s'y prête déjà : murs latéraux toujours émis et aveugles (ADR-32), toits coupés aux plans latéraux. Reste un tirage par parcelle, ses contrôles contre les règles du style (Haussmannien : 5 à 7 niveaux, mansarde) et les jointures. Fenêtres et portes : déjà là sur chaque bâtiment ; pas de vitrage ni de menuiserie.","children":[]},{"label":"2026-11-08 D-13 à D-16","note":"Tranchées par le propriétaire, les quatre options A (ADR-44).","children":[]},{"label":"2026-11-08 AG-061","note":"Le tirage se fait directement dans la fenêtre permise (fourchette ∩ ± écart autour de la voisine) : plus simple que tirer puis retirer, et sans coupe. Les règles du style se jugent sur une parcelle témoin par la résolution d'un bâtiment, pour garder exactement la sémantique des modes de fidélité. Limite notée : dans un îlot, la fermeture du tour n'est pas contrôlée. Quatre ensembles d'avant identiques.","children":[]},{"label":"2026-11-08 AG-062","note":"Aucune géométrie nouvelle : murs latéraux toujours émis (ADR-32) et toits coupés aux plans latéraux suffisent. Vérifié par invariants (U43) et à l'écran sur une rue en coude des deux côtés, copie 0.10.0-dev.","children":[]},{"label":"2026-11-08 AG-063 et recette 0.10.0","note":"Section Variété au panneau de rue : case, fourchette, écart, toits, graine ; tirage annoncé avant d'écrire. Les toits hors style restent proposés, marqués, sinon un style d'un seul toit n'aurait aucune variété. Case décochée : variety null, qui retire la variété en modification. Le vrai geste a trouvé un défaut ancien (AG-031) : les avertissements de style d'un ensemble se perdaient (lus sur le Result vide de la préparation) ; corrigé, U42, empreintes identiques. D-01 touchant les bâtiments seuls, toute la recette H02 à H25 rejouée sur le RBZ final : 0 échec.","children":[]},{"label":"2026-11-08 J11 cadré","note":"Demande du propriétaire : portes et fenêtres, commerces au rez-de-chaussée, cheminées, personnaliser un bâtiment d'une rue au clic droit. Constat : baies et cadres existent, sans vitre ni porte pleine. Chaque réglage est une clé facultative, pour que rien d'existant ne bouge. Point délicat : la largeur d'une parcelle ; recommandé, déplacer la limite mitoyenne pour garder les ids, où s'attachent les réglages propres. Carrefour en T et boucle de plusieurs voies : déjà possibles (vérifié au noyau) ; une voie seule refermée reste refusée (self_overlap).","children":[]},{"label":"2026-11-08 D-17 à D-22","note":"Tranchées par le propriétaire, les six options A (ADR-45).","children":[]},{"label":"2026-11-09 AG-064","note":"Vitre de 1 cm plutôt qu'une face seule : solide fermé, même validation que les barres. Point trouvé en codant : la révision 2 vitrée aurait changé toute rue existante à sa prochaine modification, car un ensemble enregistrait son style sans révision ; une rue fige désormais sa révision, une rue d'avant est relue en révision 1 (ADR-46), et le panneau ne propose que la dernière révision. Empreintes des profils en révision 1 et de quatre ensembles types identiques. Copie de développement dans Plugins (0.10.0 gardée dans tmp/plugins-avant-ag064) ; sonde 13/13, premier vitrage vu. Annuler n'agit qu'entre deux appels Ruby : la sonde enchaîne ses pas par minuteur.","children":[]},{"label":"2026-11-09 AG-065","note":"Vitrine de 1,20 m au moins, centrée sur la trame et sans variation des baies ; trop étroite, la travée est refusée sur /facade/front_bays (le contrat citait un champ /facade/bay_width_m qui n'existe pas). Au porche, une vitrine recouverte est arrêtée à 0,10 m du passage si elle garde 1,20 m, sinon retirée. Bandeau refusé s'il passe devant l'entrée. Hauteur 4,5 m ajoutée à l'Haussmannien révision 2, pas encore publiée. Empreintes des quatre ensembles types identiques. Sonde SketchUp 9/9 sur la copie de développement ; façade vue (docs/recette/img/ag065-commerce.jpg).","children":[]},{"label":"2026-11-09 AG-066","note":"Souches au bout du faîtage aussi pour la mansarde d'un bâtiment seul (son haut est une croupe). Point trouvé en codant : deux parcelles de même configuration partageaient leur plan sans regarder la seed ; avec les cheminées la seed devient géométrique et entre dans la clé de partage. Protocole allégé à la demande du propriétaire : seulement les tests du ticket et ceux des fichiers touchés, pas de sonde SketchUp ; il teste à la main.","children":[]},{"label":"2026-11-09 AG-067","note":"Cases Détails au panneau de rue envoyées seulement si touchées : une rue laissée telle quelle suit son style, et une rue d'une ancienne révision ne reçoit pas de vitrage par mégarde. Vérification des panneaux dans le navigateur intégré, servis en local (pas de Node sur ce poste). RBZ 0.11.0 ; recette H26 laissée au propriétaire.","children":[]},{"label":"2026-11-09 AG-068","note":"Largeurs et ids jugés après les accès de cour, dans layout_for, pour que la mise sur terrain voie les mêmes limites. Le validateur de schéma ne lit pas un additionalProperties à sous-schéma : le détail d'une entrée est tenu en Ruby (EnsembleParcels::ENTRY_SCHEMA). Empreintes des ensembles types identiques ; version de développement installée dans SketchUp.","children":[]},{"label":"2026-11-09 AG-069","note":"Avant d'écrire, l'édition de la rue est refermée et la racine sélectionnée : on ne remplace jamais une définition pendant qu'on est dedans. Valeurs de la rue calculées par le noyau (street_values), affichées en grisé ; champ vide = rue. Panneau de rue : compte et retrait des réglages propres. Panneau de parcelle essayé dans le navigateur intégré ; menu contextuel non essayé dans SketchUp.","children":[]},{"label":"2026-11-09 J12 cadré","note":"Demande du propriétaire : volets et lucarnes ; petits bois repris de D-17. Lucarne posée sans percer le toit, comme une souche (recommandé) ; volets ouverts plaqués, refus faute de place ; décisions D-23 à D-27 ouvertes.","children":[]},{"label":"2026-11-09 D-23 à D-27","note":"Options A retenues par le propriétaire (ADR-47).","children":[]},{"label":"2026-11-09 AG-070","note":"Petits bois à 1 mm devant la vitre : aucune face confondue. Les rangs ne s'écrivent qu'avec l'option, comme la matière du verre avec le vitrage.","children":[]},{"label":"2026-11-09 AG-071","note":"La place d'un volet se juge contre toutes les baies du même niveau, porte, vitrine et passage compris, pas seulement contre la fenêtre voisine.","children":[]},{"label":"2026-11-09 AG-072","note":"Écart au contrat : travée d'extrémité contre une croupe ou l'onglet d'une parcelle d'angle omise avec avertissement, pas refusée ; sinon presque aucune croupe ni rue qui tourne n'aurait eu de lucarnes. Faces du plan à 4 sommets au plus : pignons de lucarne en rectangle et triangle. Pas vu dans SketchUp.","children":[]},{"label":"2026-11-09 AG-073","note":"Un îlot Toulousain révision 3 par défaut aurait été refusé : les volets d'une fenêtre voisine du passage de porche manquaient de place. Ces volets sont omis et dits ; les autres manques restent refusés. Défauts des trois styles vérifiés en bâtiment, rue, rue à angle et îlot avant de publier.","children":[]},{"label":"2026-11-09 J13 cadré","note":"Demande : tous les styles, éléments créés au fur et à mesure ; choix de détail délégués (ADR-48). Lots du moins au plus de géométrie nouvelle ; une variante régionale est un profil à part, sans capacité regional_variant.","children":[]},{"label":"2026-11-09 AG-074","note":"Génoise abaissée sous la peau du toit prolongée : posée à H, son rang du haut aurait percé le débord.","children":[]},{"label":"2026-11-09 AG-075","note":"Les profils régionaux sont écrits par un script qui refuse d'écraser une révision publiée changée ; un test commun (U52) vérifie chaque profil en bâtiment, rue, rue à angle et îlot.","children":[]},{"label":"2026-11-09 AG-076","note":"Longère en un niveau aux murs de 0,50 m et maison de bourg aux murs de 0,45 m ; lucarnes et cheminées tiennent ensemble sur les défauts.","children":[]},{"label":"2026-11-09 AG-077","note":"Le faubourien passe à 3,0 m par étage : à 2,9 m, le porche d'un îlot ne tenait pas sous le rez-de-chaussée ; trouvé par le test commun U52.","children":[]},{"label":"2026-11-09 AG-078","note":"Listes de styles groupées par famille, même ordre aux deux panneaux ; case Génoise partout. RBZ 0.14.0 installé.","children":[]},{"label":"2026-11-09 J14 cadré","note":"Faîtage perpendiculaire en premier : pignon à redents et chalet en dépendent. Une parcelle d'angle garde un faîtage parallèle, avec avertissement.","children":[]},{"label":"2026-11-09 AG-079","note":"Toits de rangée à faîtage perpendiculaire faits par le solveur du bâtiment seul, sans débord latéral ; l'angle garde le parallèle avec avertissement. Défaut révélé au passage : un test épinglait les trois styles d'origine depuis AG-075 ; il vérifie maintenant qu'ils restent publiés.","children":[]},{"label":"2026-11-09 AG-080, AG-081","note":"Pignon à redents refusé avec un débord de plus de 5 cm, qui passerait devant les marches. Bardage par cellule de mur du dernier niveau, sans nouvelle géométrie.","children":[]},{"label":"2026-11-09 AG-082","note":"Chalet à trois niveaux : à deux, le balcon (niveau 2) n'existait pas. Liste Faîtage pour deux pans seulement. RBZ 0.15.0 installé.","children":[]},{"label":"2026-11-09 J15 cadré","note":"Rez-de-chaussée maçonné, ossature aux étages posée sur le mur. Encorbellement reporté : il décale murs, baies, planchers et toit étage par étage, un lot à lui seul ; profils publiés sans lui.","children":[]},{"label":"2026-11-09 AG-083 à AG-085","note":"Pan de bois posé sur le mur, refusé avec les détails qui occupent la même épaisseur. Écharpes en parallélogrammes, validées comme solides. Quatre profils de la famille bois ; RBZ 0.16.0 installé.","children":[]},{"label":"2026-11-09 J16 cadré","note":"Roman et Gothique en maisons de ville, pas en églises. Deux capacités portent le lot (arcs, ornements classiques) ; avant-corps, reliefs Art déco, Art nouveau et patio approchés et dits ; gradins, oriels, voûtes reportés.","children":[]},{"label":"2026-11-09 AG-086 à AG-089","note":"Le test commun U52 a trouvé trois défauts de profils avant publication : rangs de petits bois sans petits bois, croupe refusée en rangée, plafond de niveaux Art déco. Pilastre devant un porche omis et dit. RBZ 0.17.0 installé.","children":[]},{"label":"2026-11-09 J17 cadré","note":"Quatre capacités (bandeaux et murs-rideaux, pilotis, sheds, trame et brise-soleil). Volumes assemblés et scénario climatique reportés.","children":[]},{"label":"2026-11-09 AG-090 à AG-094","note":"Pilotis en rangée changés de refus en omission dite, pour que le Moderniste fasse une rue. Bandeaux bornés aux dégagements d'about (angle biais). Trois défauts de profils corrigés avant publication par U52. RBZ 0.18.0, 32 styles.","children":[]},{"label":"2026-11-09 J18 cadré","note":"Demande : clic droit Modifier, styles mêlés dans une rue (ADR-49, revient sur ADR-44), rez-de-chaussée moins répétitifs, stores et pergolas. Envoi sur GitHub des 24 commits fait à la demande.","children":[]},{"label":"2026-11-09 AG-095 à AG-099","note":"Devanture passée de shop.front à features.shop_front (shop est reconstruit à la résolution). Résumé « shops » écrit seulement avec un tirage de rez-de-chaussée, sinon toute rue variée aurait changé de plan. Largeur de fenêtre tirée pour tout le bâtiment : une seule largeur par bâtiment dans le format.","children":[]},{"label":"2026-11-10 J19 cadré","note":"Cause des T difficiles : un bout n'était raccordé qu'à 1 m de l'axe de l'autre voie, pas sur sa chaussée ; un léger dépassement faisait une croix à moignon. Dalle et seuils écrits à la création (ADR-50) pour ne pas changer l'existant.","children":[]},{"label":"2026-11-10 AG-102, AG-103","note":"La fusion se calcule à part (core/road_merge, pur) puis s'écrit en une opération qui efface les racines absorbées. Deux tests anciens épinglaient encore trois styles ou un moignon de 4 m : mis à jour. RBZ 0.20.0 installé.","children":[]},{"label":"2026-11-10 J20 cadré","note":"Le propriétaire demande tout le non-fait et des teintes faciles. Constat : le moteur ne garde la seed d'une parcelle que si elle change la géométrie ; avec des teintes elle doit rester. Balcons sans garde-corps ; seuil haut seulement signalé. Intérieur et emprises non rectangulaires renvoyés à J21 et J22.","children":[]},{"label":"2026-11-10 AG-104 à AG-108","note":"Les teintes sont des variantes `id~niveau.n` déduites du catalogue, pas des matériaux ajoutés ; la seed d'une parcelle doit alors compter dans la clé de partage. Perron, rampe et garde-corps s'écrivent à la création, comme la dalle. Le talus en rue est renvoyé à AG-109 : il faut relever au-delà de la parcelle et fermer chaque limite mitoyenne par un soutènement. RBZ 0.21.0 installé.","children":[]},{"label":"2026-11-10 AG-109","note":"Le soutènement se calcule chez la parcelle de gauche, sur sa propre grille : le profil de la voisine suit la même droite du terrain, la plateforme décalée de l'écart. Il faut donc toutes les plateformes avant de tracer. Deux tests de site_write, non relancés à AG-105, attendaient encore l'avertissement du seuil : réglés sur « Rien ». RBZ 0.22.0 installé.","children":[]},{"label":"2026-11-10 J21 cadré","note":"Le PRD excluait l'intérieur : ADR-52 l'ouvre comme option des deux modes plutôt que comme le mode « Interior » réservé, pour ne pas doubler solveurs et migrations. Quatre choix de détail appliqués selon ADR-48 (D-23 à D-26) : escalier contre le mur latéral sans baie ou mitoyen, pièces en enfilade sur les trumeaux. Matières déjà au catalogue.","children":[]},{"label":"2026-11-10 J21 reporté","note":"Le propriétaire reporte tout l'intérieur et précise qu'il se fera maison par maison, au clic droit (Créer l'intérieur), jamais pour une rue entière : AG-113 et AG-114 réécrits, pas de bloc interior au gabarit de rue (ADR-53). Priorité : EXT-06, 12, 09, 08, puis J22, puis J21.","children":[]},{"label":"2026-11-10 EXT-06 cadré","note":"Les faces du plan sont des boucles simples (la grille de découpe remplace les trous) : une triangulation par oreilles suffit. Lire le plan plutôt que le modèle rend l'export testable sans SketchUp et identique à l'octet ; les retouches à la main ne passent pas. Unreal 5.8 et Blender 5.2 sont installés ; la reconnaissance des UCX_ en glTF reste à prouver (H38).","children":[]},{"label":"2026-11-10 AG-115","note":"Un nœud glTF n'a qu'un parent : une définition partagée devient un maillage aplati (instances internes cuites), et chaque instance un nœud qui le référence avec sa matrice conjuguée par le changement d'axes. Le plan est gelé : un test qui l'altère le recopie d'abord. Blender 5.2 en ligne de commande suffit à valider le fichier.","children":[]},{"label":"2026-11-10 AG-116","note":"Le Structural a aussi des surfaces (toits) : la double face se règle par primitive, d'où deux variantes d'un même matériau, suffixée pour qu'un importeur qui fusionne par nom ne les confonde pas. Le verre n'apparaît qu'avec glazing coché et une matière glass.","children":[]},{"label":"2026-11-10 AG-117","note":"Les boîtes et prismes prévus ne suivaient pas mansardes et croupes : l'enveloppe convexe des murs et du toit les remplace, pour LOD2 comme pour la collision (D-32 revu). Dans l'ordre naturel, les sommets de la grille des murs restaient dans l'enveloppe (88 triangles) ; traiter les plus lointains d'abord la ramène à 32.","children":[]},{"label":"2026-11-10 AG-118","note":"Les ids de définitions de détail peuvent se répéter d'un plan de maison à l'autre : le cache de maillages glTF est donc indexé par plan. Le bâtiment créé sans réglage reste au niveau de détail 0, si bien qu'un test qui attend LOD1 doit demander lod 1. L'export relit et recalcule tout, sans ouvrir d'opération.","children":[]},{"label":"2026-11-10 AG-119","note":"Le guide promettait « aucune garantie pour les moteurs de jeu » : la section Exporter est réécrite avec le parcours Unreal et son repli de collision, marqué non vérifié. RBZ 0.23.0 installé.","children":[]},{"label":"2026-11-10 EXT-12 cadré","note":"FUTURE hésitait entre un module séparé et la coupe : la coupe gagne, car elle a déjà catalogue fermé, formes, définitions partagées, plafonds et éditeur. Il manquait la pose à un endroit précis (un arrêt de bus ne se répète pas tous les 28 m) : nouveau mode positions_m. Feux et croix de passage à niveau donnent déjà le modèle mât + plaque.","children":[]},{"label":"2026-11-10 AG-120","note":"Un élément qui n'est pas « spaced » est traité comme continu par le moteur : arrêt de bus et panneau n'entrent au catalogue qu'avec positions_m (AG-121), leurs formes étant déjà testées. Le schéma borne count à 10 avant l'intake : un dépassement sort en E_SCHEMA.","children":[]},{"label":"2026-11-10 AG-121","note":"Positions mesurées sur l'axe et non sur la ligne de pose : c'est la longueur lue au tracé, identique pour toutes les bandes. Le plan refuse les faces de plus de 4 sommets : plaques de panneau en éventail. Le relevé des messages lit les chaînes entre « error( » : bâtir le chemin avant l'appel.","children":[]},{"label":"2026-11-10 AG-122","note":"Le marquage est un élément dérivé de la coupe, posé à la cote de la voie et non du trottoir : une seule définition, quelle que soit la bordure. Un sommet décalé après la quantification est refusé par le plan : requantifier après tout décalage.","children":[]},{"label":"2026-11-10 AG-123","note":"Le repère d'un objet suit la chaussée la plus proche (Y vers elle) ; un panneau doit suivre le sens de circulation : RoadItems.side remplace « toward » pour lui seul, la plaque étant symétrique en Y.","children":[]},{"label":"2026-11-10 AG-124","note":"Pas de Node.js sur le poste et JScript ne lit pas l'ES5 du panneau : la syntaxe se vérifie en servant archgen/ui en local et en lisant chaque fichier par new Function dans le navigateur intégré. RBZ 0.24.0 installé.","children":[]},{"label":"2026-11-10 EXT-09 cadré","note":"Pas de réseau dans le noyau : l'utilisateur fournit les fichiers. Deux pièges vus au cadrage : un réseau ARCHGEN plafonne à 24 voies (il faut découper un quartier OSM), et la convergence des méridiens Lambert-93 atteint 5° en Bretagne (il faut tourner le terrain, pas seulement le décaler). Bâtiments OSM en rectangles orientés tant que J22 n'est pas fait.","children":[]},{"label":"2026-11-11 D-38 révisée","note":"Le propriétaire veut le téléchargement OpenStreetMap. AGENTS interdit le réseau au noyau, pas à l'adaptateur : Overpass est appelé par l'adaptateur (hôtes fermés, confirmation, seule l'emprise part), la réponse est enregistrée et lue comme un fichier local (ADR-57).","children":[]},{"label":"2026-11-11 AG-125","note":"REXML n'est plus une bibliothèque par défaut de Ruby 3 et peut manquer dans SketchUp : le XML OSM, très régulier, se lit par un balayage de balises, ce qui rend le refus du DOCTYPE trivial. Dans un bloc scan, un autre scan écrase Regexp.last_match : capturer d'abord.","children":[]},{"label":"2026-11-11 AG-126","note":"Simplifier chaque voie à part effaçait le nœud commun de deux rues qui se croisent, et avec lui le réseau : les points partagés sont fixés avant Douglas-Peucker. Une voie seule doit partir de [0, 0] : le rayon se vérifie sur le tracé ramené à son premier point.","children":[]},{"label":"2026-11-11 AG-127","note":"Le rectangle d'aire minimale d'un polygone a un côté sur l'une de ses arêtes : essayer chaque direction d'arête suffit, sans enveloppe convexe. Des maisons de ville mitoyennes se touchent : seul un chevauchement de plus de 1 % écarte un bâtiment.","children":[]},{"label":"2026-11-11 AG-128","note":"Une dalle RGE ALTI de 1 km au pas de 1 m donnerait 2 millions de faces : la fenêtre se cale sur la carte et le pas grandit jusqu'à 250 × 250 points. Altitudes relatives à l'origine pour que voies et bâtiments, à z = 0, tombent au sol. Le point d'origine du Lambert-93 sert de témoin exact au test.","children":[]},{"label":"2026-11-11 AG-129","note":"Un réseau doit partir de [0, 0] : MapRoads recentre chaque réseau et rend son origin_m (le test d'AG-126 partait par hasard de l'origine). Une racine ARCHGEN doit rester au premier niveau pour le clic droit : pas de groupe englobant, un marqueur « ARCHGEN Carte » à côté. Overpass jamais appelé en test : client HTTP injecté.","children":[]},{"label":"2026-11-11 AG-130","note":"Essai réel : 10 rues sur 300 en réseaux (carrefours dans des virages, trop proches, trop aigus) ; la moitié au mieux après retouches. Une rue à plat ne peut pas échouer : mode simple par défaut. « Ajouter du contexte » de SketchUp demande un abonnement. point_to_latlong rend [longitude, latitude] et le nord est tourné (1,14° ici).","children":[]},{"label":"2026-11-11 AG-131","note":"Pas de bibliothèque d'images en Ruby ni de mosaïque SketchUp sans abonnement : chaque tuile devient une image SketchUp posée à sa place. Carte OSM niveau 18, photo IGN niveau 19 ; serveurs de tuiles servis une image à la fois, avec cache. La carte retombe exactement sous les rues importées.","children":[]},{"label":"2026-11-11 AG-132","note":"Le carrefour suppose des branches droites : plutôt que de le courber, la voie est redressée sur la seule zone coupée et raccordée à la courbe après la coupe ; le raccord est vérifié (45° au plus, aucun bord qui recule).","children":[]},{"label":"2026-11-11 AG-133","note":"Les balcons n'existaient qu'aux niveaux 2 et 5 : option « tous les étages » ajoutée avant le profil du front de mer (règle 5). Le porche d'îlot ne tient pas sous 2,8 m : accès par interruption. Une rue de maisons reste mitoyenne.","children":[]},{"label":"2026-11-11 AG-134","note":"Photos du propriétaire : la profondeur des balcons fait le style. Révision 1 du front de mer remplacée le jour même, jamais utilisée. Baies de 2,4 m refusées en parcelle d'angle par U52 : 2,0 m.","children":[]},{"label":"2026-11-11 AG-135, AG-136","note":"Attique : deux plans validés empilés plutôt qu'un retrait appris par chaque solveur ; en angle, l'attique garde des travées de même largeur. Isolés : seul le placement change ; limite latérale prise au fond du bâtiment, sinon les parcelles d'angle rentrant étaient refusées.","children":[]},{"label":"2026-11-11 AG-137 à AG-139","note":"Une face de plan a 3 ou 4 sommets : la dalle en U est faite de cinq quadrilatères sans sommet en T. Les ailes sont des bâtiments seuls tournés d'un demi-tour (matrices d'instance comprises). Import : grille de 60 cases, intersection sur union ; une croix reste refusée.","children":[]},{"label":"2026-11-11 H43","note":"Essai réel par sonde dans SketchUp : front de mer, villa en U à bow-window, maison en L, rue isolée en T construits sans échec et conformes à l'œil.","children":[]}]}]},{"ref":"AGENTS.md","label":"Règles de travail","note":"AGENTS.md résumé, gouverne tout le reste","children":[{"label":"Ordre","note":"Premier ticket dont toutes les dépendances sont validées ; comparer les contrats à l'existant ; intégrer progressivement.","children":[]},{"label":"Noyau pur","note":"Ruby exécutable sans SketchUp, plan déterministe en mètres ; pas d'objet natif, de mutation de modèle, de réseau ni d'aléatoire global.","children":[]},{"label":"Contraintes bloquantes","note":"Géométrie et limites de plateforme bloquent dans tous les modes de fidélité ; diagnostic localisé ; ni champ inventé, ni réglage silencieux.","children":[]},{"label":"Undo","note":"Action réussie = une opération Undo ; action rejetée = document intact ; géométrie partagée jamais modifiée sur place ; revalider la cible avant chaque écriture.","children":[]},{"label":"Styles","note":"Données versionnées ; capacité et tests avant profil ; règles = clés d'un registre fermé, jamais de code chargé.","children":[]},{"label":"Livraison","note":"Centrée sur le ticket ; décision documentée et test/migration pour tout changement de format ou comportement.","children":[]},{"label":"Rapport","note":"Commandes, résultats, versions, limites ; distinguer Ruby, writer et essai réel ; aucun contrôle hôte réussi sans preuve. Sans SketchUp la sortie V0.1 reste bloquée.","children":[]},{"label":"Priorité documentaire","note":"AGENTS > PRD (périmètre) > contrats (détail) > tickets (ordre). Divergence = résolue dans la même modification.","children":[]}]},{"ref":"planning/TASKS.md","label":"Avancement","note":"Jalons et tickets, statuts à jour","children":[{"ref":"planning/ROADMAP.md","label":"J0 Base","note":"Projet testable et panneau local installable sur un hôte de référence. AG-001, 002.","children":[{"status":"fait","label":"AG-001 Dépôt et CI","note":"Arborescence, version, Gemfile, Rakefile, smoke, matrice de poste. Preuve : rake test local ; CI à confirmer au premier push.","children":[]},{"status":"fait","ref":"docs/recette/H01.md","label":"AG-002 Extension","note":"archgen.rb, main.rb, panneau de diagnostic, scripts/package_rbz.rb (rake package, ZIP reproductible). H01 réussi sur Windows 11 / SketchUp 26.2.243 seulement.","children":[]}]},{"label":"J1 Données","note":"Brouillons/effectifs vérifiés, héritage, seed stable. AG-003 à 005.","children":[{"status":"fait","label":"AG-0
