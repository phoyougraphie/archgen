s":"fait","ref":"docs/CARTOGRAPHIE_CONTRACT.md","label":"AG-139 Contours en L, T, U à l'import, RBZ 0.32.0","note":"ajustement sur grille, 80 % au moins. U89 vert.","children":[]}]},{"ref":"docs/INTERIEUR_CONTRACT.md","label":"J21 Intérieur, reporté","note":"ADR-52, ADR-53 : après EXT-06, 12, 09, 08 et J22 ; au cas par cas, au clic droit. AG-110 à 114.","children":[{"status":"afaire","label":"AG-110 Planchers et calque Intérieur","note":"interior.floors, catégories floor/stair/partition, tag.","children":[]},{"status":"afaire","label":"AG-111 Escalier et trémies","note":"deux volées, trémie, cage contre le mur latéral.","children":[]},{"status":"afaire","label":"AG-112 Cloisons et pièces","note":"enfilade sur les trumeaux, portes.","children":[]},{"status":"afaire","label":"AG-113 Créer l'intérieur au clic droit","note":"un bâtiment à la fois, jamais la rue ; mitoyen, porche, budgets.","children":[]},{"status":"afaire","label":"AG-114 Panneau, RBZ","note":"section Intérieur au panneau du bâtiment ; H37 à faire.","children":[]}]},{"label":"J22+ Extensions","note":"Priorité : EXT-06, EXT-12, EXT-09, EXT-08 (ADR-53), puis J22 ; voir branche Extensions.","children":[]}]},{"ref":"docs/PRD.md","label":"Produit","note":"Extension SketchUp Desktop : bâtiments paramétriques pour maquette et décor 3D","children":[{"label":"Fonctions P01–P09","note":"Résultats observables de la V0.1","children":[{"label":"P01 Nouveau bâtiment","note":"Menu Extensions → ARCHGEN ; style, dimensions, niveaux, trame, seed.","children":[]},{"label":"P02 Aperçu","note":"Élévation et emprise par le même noyau ; avertissements, cotes, ouvertures ; aucune entité créée.","children":[]},{"label":"P03 Générer Shell","note":"Surfaces simples, ouvertures traversantes réelles, couverture, matériaux, détails selon LOD.","children":[]},{"label":"P04 Générer Structural","note":"Même silhouette et ouvertures ; murs épais, tableaux, planchers intermédiaires.","children":[]},{"label":"P05 Modifier / rouvrir","note":"Sélection d'une racine ; paramètres rechargés après sauvegarde ; style, mode, dimensions.","children":[]},{"label":"P06 Régénérer / annuler","note":"Racine et placement conservés ; copies isolées ; confirmation ; une entrée Undo et Redo vérifié.","children":[]},{"label":"P07 Reproduire","note":"Config effective, seed, versions identiques ⇒ même plan canonique.","children":[]},{"label":"P08 Exploiter","note":"Faces orientées, matériaux nommés, pièces organisées ; un aller-retour export documenté.","children":[]},{"label":"P09 Gérer les erreurs","note":"Champ et cause expliqués ; aucune modification sur rejet ; échec d'écriture restauré.","children":[]}]},{"label":"Périmètre V0.1","note":"Une génération à la fois au niveau racine ; emprise rectangulaire ; niveaux empilés ; ouvertures rectangulaires ; 4 toits ; matériaux unis ; LOD 0 et 1 ; 3 profils jouables.","children":[]},{"label":"Frontières","note":"Structural ≠ calcul porteur ; Shell ≠ volume étanche. Pas de réglementaire, vitrage détaillé, intérieur, terrain, ville ni service distant en V0.1 (rue, îlots et terrain prévus après J5). Pas de garantie moteur de jeu, UV, collisions.","children":[]},{"label":"Signatures","note":"Haussmann : pierre, mansarde, corniche, balcon filant. Toulousain : brique foraine, tuile canal, encadrements. Brutaliste : béton, toit plat, grille, baies en retrait au LOD 1 Structural.","children":[]},{"label":"Recette de sortie","note":"Fixture 12 × 9, 4 niveaux, 4 travées dans les deux modes ; déplacer, pivoter, copier, changer le style d'une seule instance ; Undo/Redo ; réouverture ; deux autres signatures.","children":[]}]},{"ref":"docs/ARCHITECTURE.md","label":"Architecture","note":"Noyau pur + adaptateur SketchUp","children":[{"label":"Flux","note":"HtmlDialog → DialogController → BuildingService → ConfigResolver/ConstraintValidator → StyleRegistry ; GeometryEngine → solveurs → GeometryPlan/PlanValidator ; GeometryWriter et ComponentRepository → modèle.","children":[]},{"label":"Core","note":"Noyau pur, Ruby standard","children":[{"label":"StyleRegistry","note":"fetch(profile_id, revision: nil) → StyleProfile ; héritage, capacités ; révision absente ⇒ erreur.","children":[]},{"label":"ConfigResolver","note":"resolve(request, registry:, base: nil) → Result\u003cBuildingConfig>.","children":[]},{"label":"BuildingConfig","note":"to_h, geometry_input ; copie profonde gelée.","children":[]},{"label":"ConstraintValidator","note":"call(config, profile:) → Diagnostic[] ; paths JSON Pointer.","children":[]},{"label":"DeterministicRandom","note":"unit(seed, key) → Float.","children":[]},{"label":"GeometryEngine","note":"generate(config) → Result\u003cGeometryPlan> ; valide avant retour.","children":[]},{"label":"PlanValidator","note":"call(plan) → Diagnostic[] ; topologie, indices, limites, matériaux.","children":[]},{"label":"Result et Diagnostic","note":"Result = value + diagnostics ; Diagnostic = {code, severity, path, params} ; error ou warning ; aucun objet SketchUp.","children":[]}]},{"label":"Geometry","note":"Solveurs purs","children":[{"label":"Solveurs","note":"FootprintSolver, FloorPlanner, FacadeSolver, OpeningSolver, WallBuilder, RoofSolver, DetailSolver.","children":[]}]},{"label":"Adaptateur SketchUp","note":"Seul à toucher au natif","children":[{"label":"GeometryWriter","note":"write(plan, entities:, resources:) ; ne crée ni transaction ni racine.","children":[]},{"label":"ComponentRepository","note":"read, insert, swap ; appartenance, révision, contexte.","children":[]},{"label":"BuildingService","note":"preview, create, load_building, load_selection, regenerate ; propriétaire de la transaction. Testé avec doubles et en natif.","children":[]},{"label":"TransactionGuard","note":"run(model, name, instance:) ; une opération, abandon unique, relevé d'intégrité.","children":[]}]},{"label":"UI","note":"DialogController.dispatch(chaîne JSON) → réponse ; actions init, load_selection, preview, generate, regenerate ; jetons de cible et de confirmation ; observateurs natifs ; l'UI ne reproduit aucune règle de faisabilité.","children":[]},{"label":"Arborescence","note":"archgen.rb (enregistrement seul) ; archgen/{main, version, loader, core, geometry, adapters/sketchup, styles, ui} ; test/{unit, contract, fixtures, host} ; scripts/.","children":[]},{"ref":"docs/DECISIONS.md","label":"Décisions ADR","note":"Choix révisables par décision écrite","children":[{"label":"ADR-01","note":"Génération hybride : plan indépendant + writer. Shell et Structural partagent les placements.","children":[]},{"label":"ADR-02","note":"3 profils actifs, 24 fiches, 7 familles techniques.","children":[]},{"label":"ADR-03","note":"Config V1 fermée, valeurs effectives figées ; saisie séparée ; changer de style = transition explicite.","children":[]},{"label":"ADR-04","note":"Une racine top-level par bâtiment, définition de remplacement fraîche ; pas d'édition imbriquée.","children":[]},{"label":"ADR-05","note":"Subdivision explicite, onglets, 4 pièces murales fermées ; pas de booléens ; racine non solide.","children":[]},{"label":"ADR-06","note":"m/rad au calcul, degrés en saisie ; une seule conversion par frontière.","children":[]},{"label":"ADR-07","note":"Aperçu 2D en dialogue, sans écriture.","children":[]},{"label":"ADR-08","note":"Cible initiale 2024–2026, Windows et macOS, remplacée par ADR-26.","children":[]},{"label":"ADR-26","note":"Cible V0.1 : Windows et SketchUp 2026 ; seule la combinaison testée est annoncée ; pas de refus au chargement ailleurs.","children":[]},{"label":"ADR-27","note":"D-05 et D-06 : terrain intact ; assise d'un bâtiment seul, puis EXT-07, puis étagement.","children":[]},{"label":"ADR-30","note":"D-03 : coupe d'onglet, parcelle d'angle en trapèze, racine d'ensemble.","children":[]},{"label":"ADR-31","note":"D-04 : forme de l'accès selon le style, catalogue séparé.","children":[]},{"label":"ADR-33","note":"Étagement : une plateforme par parcelle, racine immobile, assises à part, soubassement seul.","children":[]},{"label":"ADR-34","note":"Voirie : la coupe est la source, format séparé, catalogues fermés, rayons au tracé, valeurs de conception sans vérification réglementaire.","children":[]},{"label":"ADR-35","note":"D-09 : arbres et lampadaires en volumes 3D simples, couleurs unies, définitions partagées.","children":[]},{"label":"ADR-36","note":"D-07 : un réseau par racine, carrefour né automatiquement, type changé au panneau.","children":[]},{"label":"ADR-32","note":"Murs mitoyens gardés, même gabarit par ensemble.","children":[]},{"label":"ADR-28","note":"Assise sur racine existante, plateforme au point haut par défaut, format séparé, terrain désigné.","children":[]},{"label":"ADR-09","note":"API minimale, géométrie locale, pas de purge globale.","children":[]},{"label":"ADR-10","note":"Migrations de format distinctes des changements de règles.","children":[]},{"label":"ADR-11","note":"Code E_PLAN pour tout invariant de plan violé.","children":[]},{"label":"ADR-12","note":"LOD 1 refusé par le moteur jusqu'à AG-015.","children":[]},{"label":"ADR-13","note":"Copie embarquée des schémas, profils et matériaux, identité vérifiée par test.","children":[]},{"label":"ADR-14","note":"Ressources marquées archgen.resource ; tags sur les conteneurs de premier niveau ; homonyme utilisateur intact.","children":[]},{"label":"ADR-15","note":"Le writer masque les arêtes entre faces coplanaires de même matériau ; plan et comptes inchangés.","children":[]},{"label":"ADR-16","note":"Marqueur de définition non autoritaire ; création refusée en contexte d'édition ; message natif jamais exposé.","children":[]},{"label":"ADR-17","note":"Cible = PID, définition, révision, empreinte de config ; jeton opaque borné ; la régénération ne renomme pas l'instance.","children":[]},{"label":"ADR-18","note":"Document reconnu à Model#guid (l'objet Model ne distingue rien sous Windows) ; enregistrer périme la cible.","children":[]},{"label":"ADR-19","note":"TransactionGuard : jamais imbriquée, abandon unique, relevé après abandon, restore_incomplete bloquant ; moteur plus récent non régénérable.","children":[]},{"label":"ADR-20","note":"W_DETAIL pour un détail sans emplacement ; corniche sur toit plat débordant refusée ; LOD 1 ouvert.","children":[]},{"label":"ADR-21","note":"Messages par raison dans UI::Messages, couverture testée ; logique JS isolée ; Diagnostic retiré du menu en AG-020.","children":[]},{"label":"ADR-22","note":"Confirmation unique de 120 s ; Annuler redemande un aperçu ; enregistrer recharge sans perdre le brouillon ; autres événements = rechargement explicite.","children":[]},{"label":"ADR-23","note":"Recettes de panneau scriptées quand c'est possible ; pilotage écran réservé aux contrôles qui l'exigent.","children":[]}]},{"ref":"docs/RUBY_SKETCHUP.md","label":"Conventions Ruby/SketchUp","note":"Tout sous Archgen ; snake_case ; gelé ; UTF-8/LF ; clés JSON chaînes, unités dans les noms ; pas de monkey patch, global, $LOAD_PATH. Point3d en m/0.0254 ou .m, jamais les deux. Pas de ComponentDefinition#manifold? dans le produit (ajoutée 2026.2).","children":[]}]},{"ref":"docs/GEOMETRY_CONTRACT.md","label":"Géométrie","note":"Contrat V1, valeurs exactes","children":[{"label":"Repères","note":"P0 = coin avant gauche au sol ; X droite, Y arrière, Z haut. Anneau CCW (0,0),(W,0),(W,D),(0,D) ; arêtes front, right, rear, left. N = T×K ; point de mur = A + uT + zK − dN.","children":[]},{"label":"Tolérances","note":"Comparaisons 1e-6 m ; quantification 1e-6 (demi éloigné de zéro, −0 → 0) ; arête émise ≥ 0,002 m ; dégagements ≥ 0,10 m ; coupes distinctes \u003c 0,002 m ⇒ erreur.","children":[]},{"label":"Placement","note":"Partagé par les deux modes","children":[{"label":"Niveaux","note":"base[i] = somme h[0…i) ; dalles Structural seulement aux limites intermédiaires, épaisseur vers le bas ; pas de dalle au RDC.","children":[]},{"label":"Travées","note":"P = (L−2M)/N ; centre u = M + (i+0,5)P ; N=0 ⇒ aucun candidat ; N>0 exige L>2M.","children":[]},{"label":"Porte","note":"Façade avant, RDC, entry_bay ; remplace la fenêtre ; z=0.","children":[]},{"label":"Jitter","note":"jitter_m × (2·unit−1), hors porte ; clé opening/\u003cside>/\u003clevel>/\u003cbay>/u ; aucun retentage.","children":[]},{"label":"RNG","note":"SHA-256 de \"archgen-rng-v1:\u003cseed>:\u003ckey>\", 13 premiers hex en entier, /2^52.","children":[]},{"label":"Dégagements","note":"wall_m+0,10 aux extrémités ; ≥0,10 entre ouvertures ; haut ≤ top−slab−0,10 (intermédiaire) ou top−0,10 (dernier). Aucun réajustement implicite.","children":[]},{"label":"Tri","note":"façade/niveau/travée puis id ; ids stables type opening/front/0/1.","children":[]}]},{"label":"Murs","note":"Grille U = {0,L} + bords d'ouvertures ; Z = {0,H} + étages + limites d'ouvertures","children":[{"label":"Shell","note":"Quad extérieur par cellule pleine, normale N ; ni dalle ni retour.","children":[]},{"label":"Structural","note":"Grille extrudée à d=t ; intérieur u=0→t, u=L→L−t (onglets) ; quads ext/int opposés + latéral si voisin absent ou vide. Pas de seuil de porte.","children":[]},{"label":"Dalles","note":"[t,W−t]×[t,D−t]×[base−s,base], i=1…n−1 ; une pièce par dalle.","children":[]}]},{"label":"Toitures","note":"r = tan(pente), E = débord, H = tête de mur ; rive sous Z=0 rejetée","children":[{"label":"Plat","note":"Quad à H avec débord.","children":[]},{"label":"Deux pans","note":"Faîtage // X à y=D/2, z=H+rD/2, prolongé à −E et W+E ; rives H−rE ; 2 pignons triangulaires à x=0 et W.","children":[]},{"label":"Croupe","note":"z = H + r·distance signée au bord ; faîtage axe long à H+r·min(W,D)/2 ; carré : 4 triangles.","children":[]},{"label":"Mansarde","note":"Rive H−r_bas·E, anneau inset I à H+r_bas·I, couronné par une croupe à pente haute sans débord.","children":[]}]},{"label":"Détails LOD 1","note":"Cadres 0,04×0,04 mutualisés, recul 0 Shell / min(0,16, wall−0,04) Structural. Corniche 0,15×0,08. Balcon 0,90×0,12 aux niveaux d'index 2 et 5. Encadrement 0,04, d∈[−0,03,0].","children":[]},{"label":"GeometryPlan","note":"{schema_version:1, engine_version, units:\"m\", nodes, definitions, openings, metrics}. Node = {id, category, children, primitive?}. Primitives surface, solid, instance.","children":[]},{"label":"Matériaux par rôle","note":"Murs, tableaux, dalles, pignons, balcons, corniches, encadrements → wall ; pans → roof ; cadres → frames.","children":[]},{"label":"Ordre de validation","note":"Configuration → faisabilité/compte estimé → plan → budget exact → écriture → contrôles natifs.","children":[]}]},{"ref":"docs/CONFIG_SCHEMA.md","label":"Configuration","note":"JSON V1 fermé","children":[{"ref":"schemas/README.md","label":"Formats","note":"Brouillon (overrides partiels) et effectif (complet, seul persisté) ; null et clés inconnues rejetés ; m et degrés.","children":[]},{"label":"Blocs","note":"schema_version, name, profile, building_type, mode, lod, seed, fidelity, footprint, levels, facade, structure, roof, materials, features.","children":[]},{"label":"Résolution","note":"1 contrôle taille/clés/types ; 2 profil exact ou courant ; 3 fusion feuille à feuille, tableaux remplacés, chances avant overrides ; 4 canonisation ; 5 vérification, gel.","children":[]},{"label":"Transition de toit","note":"Plat 0° ; deux pans/croupe 25° ; mansarde 25°/65°/0,9 m ; débord 0 ; puis champs explicites. Champ inactif explicite non nul ⇒ refus.","children":[]},{"label":"Édition","note":"Même profil : base + champs envoyés. Nouveau profil : garde name, mode, lod, seed, fidelity, footprint, levels, building_type ; reprend le reste.","children":[]},{"label":"Diagnostics","note":"E_SCHEMA, E_VERSION, E_PROFILE_UNAVAILABLE, E_HISTORICAL, W_HISTORICAL, E_OPENING_CLEARANCE, E_ROOF_GEOMETRY, E_BUDGET, E_PLAN, W_DETAIL, E_TARGET_STALE, E_CONFIRMATION_STALE, E_WRITE.","children":[]},{"label":"Empreintes","note":"JSON canonique trié. Empreinte géométrie sans name, UUID, révision, transformation ; empreinte config complète avec name pour le contrôle de cible.","children":[]},{"ref":"examples/README.md","label":"Exemples","note":"creation-draft → haussmann-12x9 ; rect-neutre-shell et structural ; toulousain ; brutalist.","children":[]}]},{"ref":"docs/STYLE_SCHEMA.md","label":"Styles","note":"Données, pas de code","children":[{"label":"Hiérarchie","note":"generic → 7 familles → feuilles ; base → family → profile seulement.","children":[]},{"label":"Fusion","note":"Feuille à feuille ; requires en union parent puis enfant ; règles par id ; règle hard jamais affaiblie.","children":[]},{"label":"Fidélité","note":"hard : toujours erreur. historical : strict erreur, plausible avertit, creative ignore. soft : avertit, creative ignore. decorative : choix déterministe.","children":[]},{"label":"Règles V1","note":"window_ratio, level_count, roof_type, material_allowed, feature_chance.","children":[]},{"ref":"examples/materials.v1.json","label":"Matériaux","note":"lime_plaster, concrete, painted_wood, limestone, zinc, brick_foraine, terracotta_canal, dark_metal.","children":[]},{"ref":"docs/styles/CATALOGUE.md","label":"Catalogue 24 styles","note":"Actifs V0.1 et planifiés par famille","children":[{"label":"Façade ordonnancée","note":"Haussmannien (actif, 5–7 niveaux, 2,7–4,0 m, mansarde) ; Baroque, Néoclassique, Renaissance (planifiés).","children":[]},{"label":"Vernaculaire maçonné","note":"Toulousain (actif, 2–5, 2,7–3,8, 15–35°) ; Provençal, Méditerranéen, Breton (planifiés).","children":[]},{"label":"Ossature bois","note":"Basque, Colombages, Normand, Alsacien (planifiés, EXT-02).","children":[]},{"label":"Monumental","note":"Roman, Gothique (planifiés, EXT-03).","children":[]},{"label":"Ornemental","note":"Art déco, Art nouveau (planifiés, EXT-03).","children":[]},{"label":"Moderne modulaire","note":"Brutaliste (actif, 2–15, 2,7–4,0, plat) ; Bauhaus, Minimaliste, Mid-century, Moderniste (planifiés).","children":[]},{"label":"Technique","note":"High-tech, Bioclimatique, Industriel (planifiés, EXT-04).","children":[]}]}]},{"ref":"docs/REGENERATION.md","label":"Régénération","note":"Identité, transaction, copies","children":[{"label":"Identité","note":"ComponentInstance racine, dictionnaire archgen.building : metadata_version, building_uuid, revision, config_json, plan_digest, engine_version, material_revision.","children":[]},{"label":"Jeton de cible","note":"Opaque, lié à session et modèle ; PID, définition, révision, SHA-256 de la config complète. Relecture à chaque écriture.","children":[]},{"label":"Copies","note":"Adresse d'édition = instance physique. UUID partagé ⇒ nouvel UUID pour la cible à la première écriture.","children":[]},{"label":"Transaction","note":"Valider sans muter ; aperçu et confirmation ; start_operation ; définition fraîche ; instance.definition= ; commit, ou abort_operation une seule fois.","children":[]},{"label":"Refus","note":"Transformation non rigide, miroir, échelle ; cible verrouillée, imbriquée, supprimée ; version inconnue en lecture seule.","children":[]}]},{"ref":"docs/UI_SPEC.md","label":"Interface","note":"Panneau modeless, local, français","children":[{"label":"Zones","note":"Projet, Dimensions, Façade, Avancé, Aperçu, Actions.","children":[]},{"label":"Pont","note":"archgen_dispatch reçoit une chaîne JSON {v, request_id, action, payload} ; actions init, load_selection, preview, generate, regenerate.","children":[]},{"label":"Confirmation","note":"Jeton unique, 120 s, consommé avant écriture ; aperçu temporisé à 250 ms ; réponses anciennes ignorées.","children":[]}]},{"ref":"docs/SECURITY_PERFORMANCE.md","label":"Sécurité et performances","note":"Limites bloquantes et cibles","children":[{"label":"JSON","note":"≤64 Kio, profondeur ≤12, doublons rejetés, nombres finis ; pas de YAML objet, Marshal, eval.","children":[]},{"label":"Limites","note":"60×60 m, ≤15 niveaux, ≤60 m sous toit, ≤90 m au sommet, ≤720 ouvertures, ≤30 000 faces uniques, ≤60 000 après expansion, ≤100 000 cellules, ≤128 définitions.","children":[]},{"label":"Cibles","note":"Plan p95 ≤150 ms ; écriture LOD 1 p95 ≤2 s ; 24×18 Structural p95 ≤5 s ; 20 régénérations : SKP +10 Mo max.","children":[]},{"label":"Dialogue","note":"HTML local, CSP sans inline ni CDN, textContent, execute_script à JSON ré-encodé (U+2028/9 échappés).","children":[]}]},{"ref":"docs/TESTING.md","label":"Tests","note":"Ruby pur, contrats, hôte","children":[{"label":"U01–U12","note":"Ruby et contrats","children":[{"label":"U01","note":"Brouillon, effectif, doublons, non-finis, 1.0 accepté, types faux, UTF-8, version ; parité schémas.","children":[]},{"label":"U02","note":"Parents, cycle, révision manquante, hard/historique, changement de style.","children":[]},{"label":"U03","note":"Golden RNG seed 42 : opening/front/0/0 = cd855d0e3d78c ; opening/rear/3/3 = 3b73a509759c3 ; feature/cornice = 8ecd39cb81f48.","children":[]},{"label":"U04","note":"Normales et bases 0 / 3,2 / 6,4 / 9,6, H = 12,8.","children":[]},{"label":"U05","note":"P=2,7 ; centres 1,95 / 4,65 / 7,35 / 10,05 ; 32 ouvertures, porte front/0/1.","children":[]},{"label":"U06","note":"Shell : front 119,00 m², rear 119,04 m² ; segment traversant.","children":[]},{"label":"U07","note":"Structural : front 27,82272 m³ ; dalles 3 × 19,63008 m³.","children":[]},{"label":"U08","note":"Altitudes et normales des 4 toits.","children":[]},{"label":"U09","note":"Sérialisation stable ; refus de bord ouvert, éventail scindé, face non plane, orientation, référence absente.","children":[]},{"label":"U10","note":"259 cellules, 218 faces Shell, 709 Structural ; limites exactes et 100 configs pseudo-aléatoires.","children":[]},{"label":"U11","note":"3 fixtures actives, baies ouvertes malgré cadres, rien au LOD 0.","children":[]},{"label":"U12","note":"Pont adverse, faux writer, panne avant/après swap.","children":[]},{"label":"U13","note":"Terrain : réglages, grille, plateforme, relief limite. Vert.","children":[]},{"label":"U14","note":"Soubassement et plancher, plan_digest inchangé. Vert.","children":[]},{"label":"U15","note":"Talus, 100 terrains pseudo-aléatoires. Vert.","children":[]},{"label":"U16","note":"Tracé et parcelles, carré de référence, 100 tracés pseudo-aléatoires. Vert.","children":[]},{"label":"U17","note":"Rangée rectangulaire, toits raccordés, plan de bâtiment seul inchangé. Vert.","children":[]},{"label":"U18","note":"Parcelle d'angle, angles saillants et rentrants, carré de référence. Vert.","children":[]},{"label":"U19","note":"Plan d'ensemble, définitions partagées, budgets. Vert.","children":[]},{"label":"U20","note":"Accès par interruption, carré de référence, 100 contours pseudo-aléatoires. Vert.","children":[]},{"label":"U21","note":"Accès par porche, Shell et Structural, limites. Vert.","children":[]},{"label":"U22","note":"Étagement : rectangle = bâtiment seul, trapèzes, angles rentrants, trous, refus par parcelle, porches, plafonds. Vert.","children":[]},{"label":"U23","note":"Coupe de voirie : limites et premier dépassement par type, registre fermé, préréglages, variation, avertissements. Vert.","children":[]},{"label":"U24","note":"Axe et rubans : largeurs exactes en droite, courbe et onglet, corde sous 5 cm, rayon limite, refus du tracé, 100 tracés reproductibles. Vert.","children":[]},{"label":"U25","note":"Éléments de voirie : positions à la main, pose sur la ligne d'un arc, crosse vers la chaussée, définitions partagées, variation, extrusions, plafonds. Vert.","children":[]},{"label":"U26","note":"Rails : écartement exact en droite, courbe et onglet, rails au ras en voie mixte, traverses, plafond. Vert.","children":[]}]},{"label":"H01–H12","note":"Recette dans SketchUp, seule preuve native","children":[{"ref":"docs/recette/H01.md","label":"H01","note":"Installer, activer, rouvrir ; une entrée de menu, console propre. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H02.md","label":"H02","note":"Neutres en mètres et en pouces : cotes, normales, trous, tags. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H03-H04.md","label":"H03","note":"Un seul Undo, ressources utilisateur intactes. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H03-H04.md","label":"H04","note":"Sauver, rouvrir ; version future refusée. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H05.md","label":"H05","note":"Copie partagée, A modifié : B intact, PID et transfo conservés. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H06-H07.md","label":"H06","note":"Pannes injectées : enregistrements identiques, aucun Undo ajouté. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H06-H07.md","label":"H07","note":"Cible verrouillée, supprimée, imbriquée, à l'échelle : aucune écriture. Réussi sur Windows / 26.2.243 ; partie panneau en H10.","children":[]},{"ref":"docs/recette/H08.md","label":"H08","note":"3 profils en LOD 0/1 et Shell/Structural. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H09.md","label":"H09","note":"Saisie rapide, invalide, clavier, hors ligne. Réussi sur Windows / 26.2.243, 150 % émulé, hors ligne non provoqué.","children":[]},{"ref":"docs/recette/H10.md","label":"H10","note":"Double clic, confirmation annulée puis refaite, observateurs, expiration, document. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H11.md","label":"H11","note":"Mesures et 20 régénérations. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H12.md","label":"H12","note":"Export Shell LOD 0 : écart ≤1 %. Réussi sur Windows / 26.2.243 Pro vers Blender 5.2.","children":[]},{"ref":"docs/recette/H13.md","label":"H13","note":"Terrain : relevé et écriture réussis, une entrée d'Annuler, terrain intact. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H14.md","label":"H14","note":"Parcours Terrain au panneau et charge sur 100 000 faces. Réussi sur Windows / 26.2.243 ; plus grand bâtiment : 1 min 30 par relevé.","children":[]},{"ref":"docs/recette/H15.md","label":"H15","note":"Écriture d'un ensemble, Annuler, pannes, copies, charge. Réussi sur Windows / 26.2.243, rues ouvertes ; 200 parcelles en 2,4 s.","children":[]},{"ref":"docs/recette/H16.md","label":"H16","note":"Outil de tracé à la souris et au clavier. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H17.md","label":"H17","note":"Parcours rue et îlot, modifier, rouvrir, vraie copie. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H18.md","label":"H18","note":"Étagement sur un vrai terrain, refus, pannes, panneau, rouvrir, charge. Réussi sur Windows / 26.2.243.","children":[]},{"ref":"docs/recette/H19.md","label":"H19","note":"Éditeur de coupe : préréglages, échelle mesurée à l'écran, refus, rouvrir, modèle inchangé. Réussi sur Windows / 26.2.243, copie de développement.","children":[]},{"ref":"docs/recette/H20.md","label":"H20","note":"Écrire une voie : service, faces écrites égales au plan, balises, Annuler, panne, copie, panneau, rouvrir, charge jusqu'à 2 km. Réussi sur Windows / 26.2.243.","children":[]}]},{"label":"Tolérances","note":"Ruby 1e-5 ; SketchUp ≤1 mm.","children":[]}]},{"ref":"docs/FUTURE.md","label":"Extensions","note":"Après J5, aucune dépendance inverse","children":[{"ref":"docs/VOLETS_LUCARNES_CONTRACT.md","label":"EXT-01 Richesse régionale","note":"Vitrage et cheminées faits (J11) ; volets, lucarnes, petits bois cadrés (J12) ; débords ; Provençal, Breton.","children":[]},{"label":"EXT-02 Bois","note":"TimberFrameSolver ; Basque, Colombages, Normand, Alsacien.","children":[]},{"label":"EXT-03 Courbes et décor","note":"Arcs, reliefs, ordres ; Art déco, Art nouveau, Baroque, Néoclassique, Renaissance.","children":[]},{"label":"EXT-04 Volumes et technique","note":"Retraits, trame, sheds, façade rideau ; modernes, Industriel, High-tech.","children":[]},{"label":"EXT-05 Interior","note":"Cadré (J21), reporté ; au cas par cas, au clic droit.","children":[]},{"ref":"docs/DECOR_JEU_CONTRACT.md","label":"EXT-06 Décor de jeu","note":"Cadré (J23) : export glTF depuis le plan, UV, PBR, collision convexe, trois LOD.","children":[]},{"ref":"docs/ENSEMBLE_CONTRACT.md","label":"EXT-07 Rue et îlots au tracé","note":"Outil ligne au geste du Mur connecté YSKE ; forme ouverte = rue, forme fermée = îlot avec 1 à 3 accès de cour générés ; une validation = un Undo. Détail en AG-028 à 036.","children":[]},{"ref":"docs/RUE_VARIEE_CONTRACT.md","label":"EXT-08 Quartier","note":"Première partie cadrée : rues variées (AG-061 à 063, D-13 à D-16) ; commerces et personnalisation d'une parcelle cadrés (J11) ; ensuite densité, styles mêlés.","children":[]},{"ref":"docs/CARTOGRAPHIE_CONTRACT.md","label":"EXT-09 Cartographie","note":"Cadré (J25) : fichiers OSM et ASCII Grid locaux, réseaux, rectangles, terrain, attribution.","children":[]},{"ref":"docs/TERRAIN_CONTRACT.md","label":"EXT-10 Terrain et terrassement","note":"Terrain intact : plateforme au point haut par défaut, soubassement, talus ; appliqué à une racine déjà placée, terrain désigné. Détail en AG-021 à 027.","children":[]},{"ref":"docs/VOIRIE_CONTRACT.md","label":"EXT-11 Voirie","note":"Coupe à l'échelle humaine, routes de l'autoroute au chemin piéton, rails et tram, carrefours simple, à feux, giratoire, double giratoire. Détail en AG-037 à 049.","children":[]},{"ref":"docs/MOBILIER_CONTRACT.md","label":"EXT-12 Mobilier urbain","note":"Cadré (J24) dans la coupe : arrêts de bus, panneaux, attaches vélos, bancs, corbeilles.","children":[]},{"ref":"docs/PONT_CONTRACT.md","label":"EXT-13 Eau et ponts","note":"Cadré le 2026-11-08 : cours d'eau et côtes comme des voies (ADR-39), ponts nés au croisement (ADR-40). Détail en AG-051 à 059.","children":[]}]}]}</script>
<script>
(function () {
  var ROOT = JSON.parse(document.getElementById('data').textContent);
  var STATUS = { fait: ['fait', '--done'], code: ['code écrit, preuve hôte manquante', '--code'], encours: ['en cours', '--doing'], afaire: ['à faire', '--todo'], bloque: ['bloqué', '--block'] };
  var NS = 'http://www.w3.org/2000/svg';
  var ROW = 34, GAP_X = 42, BOX_H = 26, PAD = 12;
  var svg = document.getElementById('svg'), view = document.getElementById('view');
  var gLinks = document.getElementById('links'), gNodes = document.getElementById('nodes');
  var panel = document.getElementById('panel'), stage = document.getElementById('stage');
  var measure = document.createElement('canvas').getContext('2d');
  measure.font = '500 13px "Hanken Grotesk", "Segoe UI", sans-serif';
  var t = { x: 0, y: 0, k: 1 }, selected = null, hits = new Set();

  var all = [];
  (function index(n, parent, depth) {
    n.parent = parent; n.depth = depth; n.children = n.children || []; n.open = depth < 1; all.push(n);
    n.children.forEach(function (c) { index(c, n, depth + 1); });
  })(ROOT, null, 0);
  // Les branches utiles au quotidien s'ouvrent d'emblée.
  all.forEach(function (n) { if (n.parent === ROOT && (n.label === 'État courant' || n.label === 'Avancement')) n.open = true; });

  function width(n) { return Math.ceil(measure.measureText(n.label).width) + PAD * 2 + (n.status ? 12 : 0) + (n.children.length ? 18 : 0); }
  function visibleKids(n) { return n.open ? n.children : []; }
  function span(n) { var k = visibleKids(n); return k.length ? k.reduce(function (s, c) { return s + span(c); }, 0) : ROW; }

  function layout() {
    var kids = ROOT.children, half = Math.ceil(kids.length / 2);
    // Répartit les branches à droite puis à gauche pour équilibrer la hauteur.
    var right = kids.slice(0, half), left = kids.slice(half);
    ROOT.x = 0; ROOT.y = 0; ROOT.w = width(ROOT); ROOT.side = 0;
    place(right, 1, ROOT.w / 2 + GAP_X); place(left, -1, ROOT.w / 2 + GAP_X);
  }
  function place(list, side, xStart) {
    var total = list.reduce(function (s, c) { return s + span(c); }, 0), y = -total / 2;
    list.forEach(function (c) { y = placeOne(c, side, xStart, y); });
  }
  function placeOne(n, side, x, y) {
    var s = span(n); n.side = side; n.w = width(n); n.y = y + s / 2; n.x = side * (x + n.w / 2);
    var cy = y;
    visibleKids(n).forEach(function (c) { cy = placeOne(c, side, x + n.w + GAP_X, cy); });
    return y + s;
  }

  function el(name, attrs, parent) { var e = document.createElementNS(NS, name); for (var a in attrs) e.setAttribute(a, attrs[a]); if (parent) parent.appendChild(e); return e; }
  function statusColor(s) { return 'var(' + STATUS[s][1] + ')'; }

  function draw() {
    layout(); gLinks.textContent = ''; gNodes.textContent = '';
    (function walk(n) {
      visibleKids(n).forEach(function (c) {
        var x1 = n.x + (c.side * n.w) / 2, x2 = c.x - (c.side * c.w) / 2, mid = (x1 + x2) / 2;
        el('path', { class: 'link', d: 'M' + x1 + ' ' + n.y + ' C' + mid + ' ' + n.y + ' ' + mid + ' ' + c.y + ' ' + x2 + ' ' + c.y }, gLinks);
        walk(c);
      });
      var cls = 'node' + (n.depth === 0 ? ' root' : n.depth === 1 ? ' branch' : '') + (n === selected ? ' sel' : '') + (hits.has(n) ? ' hit' : '');
      var g = el('g', { class: cls, transform: 'translate(' + n.x + ' ' + n.y + ')', tabindex: '0', role: 'button', 'aria-label': n.label }, gNodes);
      el('rect', { x: -n.w / 2, y: -BOX_H / 2, width: n.w, height: BOX_H, rx: 2 }, g);
      var tx = -n.w / 2 + PAD;
      if (n.status) { var r = el('rect', { class: 'tick', x: tx - 4, y: -4.5, width: 9, height: 9 }, g); r.style.fill = statusColor(n.status); r.style.stroke = 'none'; tx += 12; }
      var text = el('text', { x: tx, y: 0 }, g); text.textContent = n.label;
      if (n.children.length) { var m = el('text', { class: 'more', x: n.w / 2 - 14, y: 0 }, g); m.textContent = n.open ? '−' : '+'; }
      g.addEventListener('click', function (e) { e.stopPropagation(); pick(n, true); });
      g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(n, true); } });
    })(ROOT);
  }

  function pick(n, toggle) {
    if (toggle && n.children.length && n.depth > 0) n.open = !n.open;
    selected = n; showPanel(n); draw();
  }

  function showPanel(n) {
    panel.textContent = '';
    var crumbs = []; for (var p = n.parent; p; p = p.parent) crumbs.unshift(p.label);
    if (crumbs.length) add('div', 'crumbs', crumbs.join(' / '));
    add('h2', '', n.label);
    if (n.status) { var s = add('span', 'status', STATUS[n.status][0]); s.style.setProperty('--c', statusColor(n.status)); }
    if (n.note) add('p', '', n.note);
    if (n.ref) add('p', 'ref', n.ref);
    if (n.children.length) {
      var ul = add('ul', '', '');
      n.children.forEach(function (c) {
        var li = document.createElement('li'), b = document.createElement('button');
        b.type = 'button'; b.textContent = c.label;
        b.addEventListener('click', function () { reveal(c); pick(c, false); center(c); });
        li.appendChild(b); ul.appendChild(li);
      });
    }
    function add(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; panel.appendChild(e); return e; }
  }

  function reveal(n) { for (var p = n.parent; p; p = p.parent) p.open = true; }
  function apply() { view.setAttribute('transform', 'translate(' + t.x + ' ' + t.y + ') scale(' + t.k + ')'); }
  function center(n) { var r = stage.getBoundingClientRect(); layout(); t.x = r.width / 2 - n.x * t.k; t.y = r.height / 2 - n.y * t.k; apply(); }
  function fit() {
    layout();
    var vis = []; (function w(n) { vis.push(n); visibleKids(n).forEach(w); })(ROOT);
    var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    vis.forEach(function (n) { x0 = Math.min(x0, n.x - n.w / 2); x1 = Math.max(x1, n.x + n.w / 2); y0 = Math.min(y0, n.y - BOX_H); y1 = Math.max(y1, n.y + BOX_H); });
    var r = stage.getBoundingClientRect();
    t.k = Math.min(1.1, Math.max(0.2, Math.min((r.width - 32) / (x1 - x0), (r.height - 32) / (y1 - y0))));
    t.x = r.width / 2 - ((x0 + x1) / 2) * t.k; t.y = r.height / 2 - ((y0 + y1) / 2) * t.k; apply();
  }

  // Déplacement et zoom : pointeur, molette, pincement.
  var pts = new Map(), last = null, pinch = 0;
  stage.addEventListener('pointerdown', function (e) { if (e.target.closest && e.target.closest('.node')) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); last = e; stage.classList.add('drag'); });
  stage.addEventListener('pointermove', function (e) {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pts.size === 2) {
      var a = Array.from(pts.values()), d = Math.hypot(a[0].clientX - a[1].clientX, a[0].clientY - a[1].clientY);
      if (pinch) zoom(d / pinch, (a[0].clientX + a[1].clientX) / 2, (a[0].clientY + a[1].clientY) / 2);
      pinch = d; return;
    }
    t.x += e.clientX - last.clientX; t.y += e.clientY - last.clientY; last = e; apply();
  });
  function up(e) { pts.delete(e.pointerId); pinch = 0; if (!pts.size) stage.classList.remove('drag'); else last = Array.from(pts.values())[0]; }
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  function zoom(f, cx, cy) { var r = stage.getBoundingClientRect(), k = Math.min(2.5, Math.max(0.15, t.k * f)); f = k / t.k; t.x = cx - r.left - (cx - r.left - t.x) * f; t.y = cy - r.top - (cy - r.top - t.y) * f; t.k = k; apply(); }
  stage.addEventListener('wheel', function (e) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : 0.89, e.clientX, e.clientY); }, { passive: false });

  document.getElementById('open').addEventListener('click', function () { all.forEach(function (n) { n.open = true; }); draw(); fit(); });
  document.getElementById('close').addEventListener('click', function () { all.forEach(function (n) { n.open = n.depth < 1; }); draw(); fit(); });
  document.getElementById('fit').addEventListener('click', fit);
  document.getElementById('q').addEventListener('input', function (e) {
    var q = e.target.value.trim().toLowerCase(); hits = new Set();
    if (q.length > 1) all.forEach(function (n) { if ((n.label + ' ' + (n.note || '')).toLowerCase().indexOf(q) >= 0) { hits.add(n); reveal(n); } });
    draw(); if (hits.size) fit();
  });
  window.addEventListener('resize', fit);

  // Avancement calculé depuis les tickets de la carte, jamais écrit à la main.
  var tickets = all.filter(function (n) { return /^AG-\d+/.test(n.label); });
  var counts = {}; tickets.forEach(function (n) { counts[n.status] = (counts[n.status] || 0) + 1; });
  var bar = document.getElementById('bar');
  ['fait', 'code', 'encours', 'bloque'].forEach(function (s) { if (!counts[s]) return; var i = document.createElement('i'); i.style.width = (100 * counts[s] / tickets.length) + '%'; i.style.background = statusColor(s); bar.appendChild(i); });
  bar.setAttribute('aria-label', (counts.fait || 0) + ' tickets faits sur ' + tickets.length);
  document.getElementById('count').textContent = (counts.fait || 0) + ' faits' + (counts.code ? ' + ' + counts.code + ' code' : '') + ' / ' + tickets.length + ' tickets';

  function start() { var first = all.filter(function (n) { return n.label === 'Prochaine action'; })[0] || ROOT; selected = first; showPanel(first); draw(); fit(); }
  start();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measure.font = '500 13px "Hanken Grotesk", "Segoe UI", sans-serif'; draw(); fit(); });
})();
</script>
